name: Agent Pipeline - Discord Reporting

# Reports every state change of the AGENT code factory to Discord:
#   - an issue gets a status:* label   (to-do / in-progress / in-review / blocked / done)
#   - an agent PR is opened against development
#   - an agent PR is merged into development -> issue labelled status:done + closed
#   - CI fails on development or on an agent PR
# It also deletes agent/* branches once their PR is closed, plus a sweep of
# stale agent/* branches with no open PR (Claude sessions can't delete refs).
# Runs on GitHub's runners, which can read the DISCORD_WEBHOOK_URL secret
# (Claude sessions cannot).

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, reopened, closed]
    branches: [development]
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Branch sweep: Claude sessions cannot delete branches, so Actions does it.
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

permissions:
  issues: write
  pull-requests: read
  actions: read
  contents: write

jobs:
  status-label:
    if: github.event_name == 'issues' && startsWith(github.event.label.name, 'status:')
    runs-on: ubuntu-latest
    steps:
      - name: Post status change
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LABEL: ${{ github.event.label.name }}
          NUM: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          URL: ${{ github.event.issue.html_url }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          case "$LABEL" in
            status:to-do)        ICON="📋" ;;
            status:in-progress)  ICON="🛠️" ;;
            status:in-review)    ICON="👀" ;;
            status:done)         ICON="✅" ;;
            status:blocked)      ICON="🚫" ;;
            *)                   ICON="🔖" ;;
          esac
          MSG="$ICON **#$NUM $TITLE** → \`$LABEL\`  (by $ACTOR)\n$URL"
          # PRs opened by Claude sessions (GitHub MCP) don't fire pull_request
          # workflows, so the in-review alert carries the PR link itself.
          if [ "$LABEL" = "status:in-review" ]; then
            TICKET=$(gh api "repos/$REPO/issues/$NUM" --jq '[.labels[].name | select(test("^AGENT-[0-9]+$"))][0] // empty')
            if [ -n "$TICKET" ]; then
              PR=$(gh api "repos/$REPO/pulls?state=open&base=development&per_page=100" \
                | jq -r --arg t "$TICKET" '[.[] | select((.head.ref + " " + .title) | ascii_upcase | contains($t))][0] | if . then "🔀 PR #\(.number): \(.html_url) (branch \(.head.ref))" else empty end')
              [ -n "$PR" ] && MSG="$MSG\n$PR"
            fi
          fi
          echo "::notice title=discord::$(printf '%b' "$MSG" | tr '\n' ' ')"
          jq -n --arg c "$(printf '%b' "$MSG")" '{content:$c}' \
            | curl -fsS -X POST "$WEBHOOK" -H 'Content-Type: application/json' -d @-

  pr-opened:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Post PR opened
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NUM: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          ADDS: ${{ github.event.pull_request.additions }}
          DELS: ${{ github.event.pull_request.deletions }}
        run: |
          MSG="🔀 **PR #$NUM opened → development**: $TITLE\nBranch \`$HEAD\` · +$ADDS / -$DELS\n$URL"
          echo "::notice title=discord::$(printf '%b' "$MSG" | tr '\n' ' ')"
          jq -n --arg c "$(printf '%b' "$MSG")" '{content:$c}' \
            | curl -fsS -X POST "$WEBHOOK" -H 'Content-Type: application/json' -d @-

  pr-merged:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - name: Mark ticket done and post
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NUM: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          URL: ${{ github.event.pull_request.html_url }}
        run: |
          TICKET=$(printf '%s %s' "$HEAD" "$TITLE" | grep -oiE 'AGENT-[0-9]+' | head -1 | tr a-z A-Z)
          ISSUE=""
          if [ -n "$TICKET" ]; then
            ISSUE=$(gh api "repos/$REPO/issues?labels=$TICKET&state=all" --jq '.[0].number // empty')
          fi
          if [ -n "$ISSUE" ]; then
            for L in status:to-do status:in-progress status:in-review status:blocked; do
              gh api -X DELETE "repos/$REPO/issues/$ISSUE/labels/$L" >/dev/null 2>&1 || true
            done
            gh api -X POST "repos/$REPO/issues/$ISSUE/labels" -f 'labels[]=status:done' >/dev/null
            gh api -X PATCH "repos/$REPO/issues/$ISSUE" -f state=closed -f state_reason=completed >/dev/null
            gh api -X POST "repos/$REPO/issues/$ISSUE/comments" -f body="Merged into \`development\` via #$NUM." >/dev/null
            DONE="Ticket #$ISSUE ($TICKET) → \`status:done\`, closed."
          else
            DONE="⚠️ No AGENT ticket found for this PR — status not updated."
          fi
          REMAINING=$(gh api "repos/$REPO/issues?labels=status:to-do&state=open&per_page=100" --jq 'length')
          MSG="✅ **PR #$NUM merged into development**: $TITLE\n$DONE\n📊 $REMAINING tickets left in to-do.\n$URL"
          echo "::notice title=discord::$(printf '%b' "$MSG" | tr '\n' ' ')"
          jq -n --arg c "$(printf '%b' "$MSG")" '{content:$c}' \
            | curl -fsS -X POST "$WEBHOOK" -H 'Content-Type: application/json' -d @-

  ci-failed:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.head_branch == 'development' || startsWith(github.event.workflow_run.head_branch, 'agent/'))
    runs-on: ubuntu-latest
    steps:
      - name: Post CI failure
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          URL: ${{ github.event.workflow_run.html_url }}
        run: |
          MSG="❌ **CI failed** on \`$BRANCH\` (\`${SHA:0:7}\`)\n$URL"
          echo "::notice title=discord::$(printf '%b' "$MSG" | tr '\n' ' ')"
          jq -n --arg c "$(printf '%b' "$MSG")" '{content:$c}' \
            | curl -fsS -X POST "$WEBHOOK" -H 'Content-Type: application/json' -d @-

  delete-closed-agent-branch:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      startsWith(github.event.pull_request.head.ref, 'agent/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete head branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.ref }}
        run: gh api -X DELETE "repos/$REPO/git/refs/heads/$REF"

  sweep-agent-branches:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Delete agent/* branches with no open PR (self-tests now, others after 6h)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          OPEN=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --jq '[.[].head.ref]')
          NOW=$(date +%s)
          gh api "repos/$REPO/branches?per_page=100" --paginate --jq '.[].name | select(startswith("agent/"))' | while read -r B; do
            if echo "$OPEN" | jq -e --arg b "$B" 'index($b)' >/dev/null; then echo "keep $B (open PR)"; continue; fi
            WHEN=$(gh api "repos/$REPO/commits/$B" --jq '.commit.committer.date')
            AGE=$(( NOW - $(date -d "$WHEN" +%s) ))
            case "$B" in agent/AGENT-00-*) ;; *) [ "$AGE" -lt 21600 ] && { echo "keep $B (young, may be mid-run)"; continue; } ;; esac
            gh api -X DELETE "repos/$REPO/git/refs/heads/$B" && echo "deleted $B"
          done
