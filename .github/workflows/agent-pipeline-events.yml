name: Agent Pipeline - Discord Reporting

# Reports every state change of the AGENT code factory to Discord:
#   - an issue gets a status:* label   (to-do / in-progress / in-review / blocked / done)
#   - an agent PR is opened against development
#   - an agent PR is merged into development -> issue labelled status:done + closed
#   - CI fails on development or on an agent PR
#   - a ticket is flagged `needs-jon` (review loop gave up, or a human is needed)
# It also deletes agent/* branches once their PR is closed, plus a sweep of
# stale agent/* branches with no open PR (Claude sessions can't delete refs).
# Runs on GitHub's runners, which can read the DISCORD_WEBHOOK_URL secret
# (Claude sessions cannot).
#
# EXACTLY-ONCE RULES (one logical event = one Discord message):
#   * every post goes through .github/actions/discord-notify (single mechanism)
#   * one owner per event: ticket PRs are announced by the status:in-review
#     alert (it carries the PR link), so pr-opened only posts for non-agent PRs
#   * status:done is announced by pr-merged; the label itself is not re-announced
#   * status:blocked is not announced when needs-jon is set (needs-jon owns it)
#   * CI failures on agent/* are reported from the pull_request run only
#   * each job has a concurrency group keyed on event + issue/PR/sha number

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, reopened, closed]
    branches: [development]
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Branch sweep: Claude sessions cannot delete branches, so Actions does it.
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

permissions:
  issues: write
  pull-requests: read
  actions: read
  contents: write

jobs:
  label-alert:
    # status:* label added, or needs-jon added. (A status change is "remove
    # old label + add new label"; only the add fires `labeled`, so one change
    # = one run.)
    if: >-
      github.event_name == 'issues' &&
      (startsWith(github.event.label.name, 'status:') || github.event.label.name == 'needs-jon') &&
      !(github.event.label.name == 'status:done' && github.actor == 'github-actions[bot]')
    runs-on: ubuntu-latest
    concurrency:
      group: discord-label-${{ github.event.issue.number }}-${{ github.event.label.name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - name: Build message
        id: msg
        env:
          LABEL: ${{ github.event.label.name }}
          NUM: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          URL: ${{ github.event.issue.html_url }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ISSUE_LABELS=$(gh api "repos/$REPO/issues/$NUM" --jq '[.labels[].name] | join(",")')
          # needs-jon owns the alert; the accompanying status:blocked stays quiet.
          if [ "$LABEL" = "status:blocked" ] && echo ",$ISSUE_LABELS," | grep -q ',needs-jon,'; then
            echo "send=false" >> "$GITHUB_OUTPUT"; echo "blocked+needs-jon: needs-jon alert covers this"; exit 0
          fi
          case "$LABEL" in
            status:to-do)        ICON="📋" ;;
            status:in-progress)  ICON="🛠️" ;;
            status:in-review)    ICON="👀" ;;
            status:done)         ICON="✅" ;;
            status:blocked)      ICON="🚫" ;;
            needs-jon)           ICON="🙋" ;;
            *)                   ICON="🔖" ;;
          esac
          MSG="$ICON **#$NUM $TITLE** → \`$LABEL\`  (by $ACTOR)\n$URL"
          if [ "$LABEL" = "needs-jon" ]; then
            FAILS=$(echo "$ISSUE_LABELS" | tr ',' '\n' | grep -E '^review-failed:' | sort | tail -1 || true)
            LAST=$(gh api "repos/$REPO/issues/$NUM/comments?per_page=100" --jq '[.[] | select(.body | contains("<!-- agent-review-feedback"))] | last | .body // ""' | head -c 600)
            MSG="🙋 **NEEDS JON — #$NUM $TITLE**  (${FAILS:-no review counter})\nThe factory stopped working on this ticket.\n$URL"
            [ -n "$LAST" ] && MSG="$MSG\n> $(printf '%s' "$LAST" | tr '\n' ' ' | head -c 500)"
          fi
          # The in-review alert carries the PR link (it is the ONLY announcement
          # of a ticket PR opening). The PR may be created a few seconds after
          # the label, so retry the lookup.
          if [ "$LABEL" = "status:in-review" ]; then
            TICKET=$(echo "$ISSUE_LABELS" | tr ',' '\n' | grep -E '^AGENT-[0-9]+$' | head -1 || true)
            PR=""
            for i in 1 2 3 4; do
              if [ -n "$TICKET" ]; then
                PR=$(gh api "repos/$REPO/pulls?state=open&base=development&per_page=100" \
                  | jq -r --arg t "$TICKET" '[.[] | select((.head.ref + " " + .title) | ascii_upcase | contains($t))][0] | if . then "🔀 PR #\(.number): \(.html_url) (branch \(.head.ref), +\(.additions // 0)/-\(.deletions // 0))" else empty end')
              else
                PR=$(gh api "repos/$REPO/pulls?state=open&base=development&per_page=100" \
                  | jq -r --arg n "#$NUM" '[.[] | select((.body // "") | ascii_downcase | test("implements " + $n + "\\b"))][0] | if . then "🔀 PR #\(.number): \(.html_url) (branch \(.head.ref))" else empty end')
              fi
              [ -n "$PR" ] && break
              sleep 10
            done
            [ -n "$PR" ] && MSG="$MSG\n$PR"
          fi
          {
            echo "send=true"
            echo "text<<EOF_MSG"
            printf '%s\n' "$MSG"
            echo "EOF_MSG"
          } >> "$GITHUB_OUTPUT"
      - name: Post to Discord
        if: steps.msg.outputs.send == 'true'
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          message: ${{ steps.msg.outputs.text }}

  pr-opened:
    # Ticket PRs (agent/*) are announced once, by the status:in-review alert.
    # This job only covers PRs that have no such alert.
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      !startsWith(github.event.pull_request.head.ref, 'agent/')
    runs-on: ubuntu-latest
    concurrency:
      group: discord-pr-opened-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          message: |
            🔀 **PR #${{ github.event.pull_request.number }} ${{ github.event.action }} → development**: ${{ github.event.pull_request.title }}
            Branch `${{ github.event.pull_request.head.ref }}` · +${{ github.event.pull_request.additions }} / -${{ github.event.pull_request.deletions }}
            ${{ github.event.pull_request.html_url }}

  pr-merged:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged
    runs-on: ubuntu-latest
    concurrency:
      group: discord-pr-merged-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - name: Mark ticket done
        id: done
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          URL: ${{ github.event.pull_request.html_url }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          TICKET=$(printf '%s %s' "$HEAD" "$TITLE" | grep -oiE 'AGENT-[0-9]+' | head -1 | tr a-z A-Z || true)
          ISSUE=""
          if [ -n "$TICKET" ]; then
            ISSUE=$(gh api "repos/$REPO/issues?labels=$TICKET&state=all" --jq '.[0].number // empty')
          fi
          # Tickets without an AGENT-NN id (e.g. report tickets): every factory
          # PR body starts with "Implements #N".
          if [ -z "$ISSUE" ]; then
            ISSUE=$(printf '%s' "$BODY" | grep -oiE 'implements #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
            [ -n "$ISSUE" ] && TICKET="#$ISSUE"
          fi
          if [ -n "$ISSUE" ]; then
            # Clear every workflow label (status:*, review-failed:*, needs-jon);
            # the review failure counter resets when a ticket is done.
            for L in status:to-do status:in-progress status:in-review status:blocked review-failed:1 review-failed:2 review-failed:3 needs-jon; do
              gh api -X DELETE "repos/$REPO/issues/$ISSUE/labels/$L" >/dev/null 2>&1 || true
            done
            gh api -X POST "repos/$REPO/issues/$ISSUE/labels" -f 'labels[]=status:done' >/dev/null
            gh api -X PATCH "repos/$REPO/issues/$ISSUE" -f state=closed -f state_reason=completed >/dev/null
            gh api -X POST "repos/$REPO/issues/$ISSUE/comments" -f body="Merged into \`development\` via #$NUM." >/dev/null
            DONE="Ticket #$ISSUE ($TICKET) → \`status:done\`, closed."
          else
            DONE="⚠️ No AGENT ticket found for this PR — status not updated."
          fi
          REMAINING=$(gh api "repos/$REPO/issues?labels=status:to-do&state=open&per_page=100" --jq 'length')
          MSG="✅ **PR #$NUM merged into development**: $TITLE\n$DONE\n📊 $REMAINING tickets left in to-do.\n$URL"
          {
            echo "text<<EOF_MSG"
            printf '%s\n' "$MSG"
            echo "EOF_MSG"
          } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          message: ${{ steps.done.outputs.text }}

  ci-failed:
    # A pushed agent/* commit with an open PR produces TWO failing CI runs
    # (push + pull_request). Report agent branches from the pull_request run
    # only; development has no PR run, so it is reported from the push run.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      (
        (github.event.workflow_run.head_branch == 'development' && github.event.workflow_run.event == 'push') ||
        (startsWith(github.event.workflow_run.head_branch, 'agent/') && github.event.workflow_run.event == 'pull_request')
      )
    runs-on: ubuntu-latest
    concurrency:
      group: discord-ci-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          message: |
            ❌ **CI failed** on `${{ github.event.workflow_run.head_branch }}` (`${{ github.event.workflow_run.head_sha }}`)
            ${{ github.event.workflow_run.html_url }}

  delete-closed-agent-branch:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      startsWith(github.event.pull_request.head.ref, 'agent/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete head branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.ref }}
        run: gh api -X DELETE "repos/$REPO/git/refs/heads/$REF"

  sweep-agent-branches:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Delete agent/* branches with no open PR (self-tests now, others after 6h)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          OPEN=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --jq '[.[].head.ref]')
          NOW=$(date +%s)
          gh api "repos/$REPO/branches?per_page=100" --paginate --jq '.[].name | select(startswith("agent/"))' | while read -r B; do
            if echo "$OPEN" | jq -e --arg b "$B" 'index($b)' >/dev/null; then echo "keep $B (open PR)"; continue; fi
            WHEN=$(gh api "repos/$REPO/commits/$B" --jq '.commit.committer.date')
            AGE=$(( NOW - $(date -d "$WHEN" +%s) ))
            case "$B" in agent/AGENT-00-*) ;; *) [ "$AGE" -lt 21600 ] && { echo "keep $B (young, may be mid-run)"; continue; } ;; esac
            gh api -X DELETE "repos/$REPO/git/refs/heads/$B" && echo "deleted $B"
          done
