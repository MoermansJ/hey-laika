name: CI

on:
  push:
  pull_request:

jobs:
  orchestrator:
    name: Java orchestrator (mvnw test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # mvnw is tracked without the executable bit (Windows checkout).
      - run: chmod +x mvnw
      # No database service: the suite is unit tests, a @WebMvcTest slice and
      # ArchUnit rules; nothing boots a full context against Postgres.
      - run: ./mvnw -B test

  adapter:
    name: Python adapter (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            dog/requirements.txt
            dog/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # tests/conftest.py forces MOCK_MODE and the mock decision engine, so no
      # hardware, Ollama or API key is needed.
      # Failures are re-emitted as annotations so they're readable through the
      # checks API (agent sessions can't download raw job logs).
      - name: pytest
        run: |
          set -o pipefail
          pytest -q -rfE 2>&1 | tee pytest.log
      - name: Annotate pytest failures
        if: failure()
        run: |
          grep -E "^(ERROR|FAILED|E )|Error:|error:" pytest.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
