name: Commit Debounce - Smart Idle Detection

on:
  push:
    branches:
      - main
      - development

jobs:
  smart-idle-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest commit info
        id: commit-info
        run: |
          LATEST_COMMIT=$(git rev-parse HEAD)
          LATEST_COMMIT_TIME=$(git log -1 --format=%cI)
          LATEST_COMMIT_UNIX=$(date -d "$LATEST_COMMIT_TIME" +%s)
          NOW_UNIX=$(date +%s)
          MINUTES_SINCE=$(( (NOW_UNIX - LATEST_COMMIT_UNIX) / 60 ))
          
          echo "commit_hash=$LATEST_COMMIT" >> $GITHUB_OUTPUT
          echo "commit_time=$LATEST_COMMIT_TIME" >> $GITHUB_OUTPUT
          echo "commit_unix=$LATEST_COMMIT_UNIX" >> $GITHUB_OUTPUT
          echo "minutes_since=$MINUTES_SINCE" >> $GITHUB_OUTPUT

      - name: Calculate wait time
        id: wait-calc
        run: |
          MINUTES_SINCE=${{ steps.commit-info.outputs.minutes_since }}
          TARGET_MINUTES=25
          
          if [ $MINUTES_SINCE -ge $TARGET_MINUTES ]; then
            WAIT_SECONDS=0
          else
            REMAINING_MINUTES=$((TARGET_MINUTES - MINUTES_SINCE))
            WAIT_SECONDS=$((REMAINING_MINUTES * 60))
          fi
          
          echo "wait_seconds=$WAIT_SECONDS" >> $GITHUB_OUTPUT

      - name: Wait for remaining time
        run: |
          WAIT_SECONDS=${{ steps.wait-calc.outputs.wait_seconds }}
          if [ $WAIT_SECONDS -gt 0 ]; then
            sleep $WAIT_SECONDS
          fi

      - name: Check if commit is still the latest
        id: idle-check
        run: |
          git fetch origin main development
          ORIGINAL_COMMIT="${{ steps.commit-info.outputs.commit_hash }}"
          CURRENT_COMMIT=$(git rev-parse "origin/${{ github.ref_name }}")

          # Exactly-once rules:
          # 1. Only the run for the CURRENT tip may alert. (The old rule also
          #    let superseded runs alert once the newer commit was 25 min old,
          #    so a burst of pushes could alert several times.)
          # 2. `Merge main into development` pushes the same content to both
          #    branches, which used to alert twice for one idle period. When
          #    development has the same tree as main, main's alert covers it.
          if [ "$ORIGINAL_COMMIT" != "$CURRENT_COMMIT" ]; then
            echo "is_idle=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "development" ] \
            && [ "$(git rev-parse origin/development^{tree})" = "$(git rev-parse origin/main^{tree})" ]; then
            echo "development tree == main tree: main's alert covers this"
            echo "is_idle=false" >> $GITHUB_OUTPUT
          else
            echo "is_idle=true" >> $GITHUB_OUTPUT
          fi

      - name: Send Discord notification if idle
        if: steps.idle-check.outputs.is_idle == 'true'
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          message: |
            🤖 **No pushes to `${{ github.ref_name }}` for 25+ minutes**

            Last commit: `${{ steps.commit-info.outputs.commit_hash }}`

            📋 Open tickets: https://github.com/${{ github.repository }}/issues?q=is%3Aopen+label%3Aagent-tool-composition
