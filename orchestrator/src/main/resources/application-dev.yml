# Standalone dev profile: no Docker/Postgres needed. Run with
#   ./mvnw spring-boot:run "-Dspring-boot.run.profiles=dev"
# Behavior loops auto-start with simulated actions (see behavior.* in
# application.yml), so decisions and personality drift show in the console.
spring:
  datasource:
    url: jdbc:h2:mem:bittle_fleet;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
