server:
  port: 8080

spring:
  application:
    name: bittle-orchestrator
  task:
    scheduling:
      # Three sweeps plus the hourly rollup share this pool; with one thread a
      # single slow adapter call (up to the 30 s command read timeout) stalled
      # every broadcast. Polling reads use a 3 s client (RestClientConfig).
      pool:
        size: 3
  datasource:
    # Local dev default matches the compose postgres host mapping (15432);
    # in Docker this is overridden via SPRING_DATASOURCE_URL.
    url: jdbc:postgresql://localhost:15432/bittle_fleet
    username: bittle
    password: bittle
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  web:
    resources:
      cache:
        cachecontrol:
          # The console is plain static files with no versioned names; make
          # every browser revalidate them (conditional GETs on Last-Modified)
          # so a rebuilt image is never paired with a stale app.js.
          no-cache: true

# The REST API is documented from the controllers: /v3/api-docs (JSON) and
# /swagger-ui.html. OpenApiSpecTest keeps docs/api/openapi.json in sync, so the
# writer is deterministic (sorted keys, pretty-printed).
springdoc:
  paths-to-match: /api/**
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Autonomous behavior loops (orchestrator-owned brain; see
# docs/design/PERSONALITY_SYSTEM_DESIGN.md). Loops are started via the behavior API
# unless auto-start is enabled.
behavior:
  decision-interval-ms: 2500
  sleep-decision-interval-ms: 5000
  failure-backoff-ms: 5000
  history-size: 200
  # Phase 1b: actions go to the adapter's execute_action endpoint and move
  # the physical robot. auto-start is off so hardware motion begins only when
  # a loop is started deliberately (Behavior Lab / POST /behavior/start).
  auto-start: false
  simulate-actions: false
  # idle-cycle: true lets a calm robot run the sit -> look -> stand cycle
  # instead of IDLE_CALM only (docs/design/ARCHITECTURE.md §4).
  idle-cycle: false
  # Lease on the loop, renewed every cycle and shared through the leases
  # table; a second orchestrator instance may take over once it lapses. It
  # outlasts the longest action (30 s adapter read timeout) plus one interval.
  lease-ttl-ms: 60000

# AI cost valuation (metrics brief D.2): adapters measure exact token
# counts; the orchestrator alone knows prices. USD per million tokens,
# first-party Anthropic rates as of 2026-09. The adapter reports which
# model it actually calls (schema metadata.decisionModel); default-model
# is used only when that is unknown. Add or override entries under prices.
metrics:
  default-model: claude-opus-5
  prices:
    claude-opus-5:
      input-usd-per-mtok: 5.0
      output-usd-per-mtok: 25.0
    claude-sonnet-5:
      input-usd-per-mtok: 2.0
      output-usd-per-mtok: 10.0
    claude-haiku-4-5:
      input-usd-per-mtok: 1.0
      output-usd-per-mtok: 5.0

# Agent tool calls to the adapter's behavior arbiter (ArbiterClient, AGENT-04).
# The adapter URL is each robot's service-url below; these are the timeouts.
arbiter:
  connect-timeout-ms: 2000
  read-timeout-ms: 5000

# Goal outcome checkers (AGENT-08): a run succeeds when the measured change
# reaches the threshold; *-scale is the change that counts as confidence 1.0.
agent:
  # Agent run completion polling (AGENT-10): every poll-interval-ms the
  # orchestrator asks the arbiter about up to poll-batch-size pending agent
  # runs; one with no completion after run-stale-after-minutes is closed.
  polling-enabled: true
  poll-interval-ms: 500
  poll-batch-size: 20
  run-stale-after-minutes: 10
  # Sensor snapshots taken at agent run start/end (AGENT-09) stay cached this long.
  sensor-snapshot-ttl-minutes: 10
  outcome:
    look-centroid-px: 30
    look-centroid-scale-px: 100
    look-imu-deg: 10
    look-imu-scale-deg: 30
    move-forward-cm: 5
    move-forward-scale-cm: 20
    listen-amplitude-delta: 0.1
    listen-amplitude-scale: 0.3
    bark-amplitude: 0.3
    bark-amplitude-scale: 0.6
    bark-min-hz: 250
    bark-max-hz: 2000
    tilt-head-deg: 10
    tilt-head-scale-deg: 30

# Robot instances managed by this platform. Each entry points at the Python
# adapter service that implements the robot's hardware/AI logic. Override in
# Docker via e.g. BITTLE_ROBOTS_0_SERVICEURL=http://python-bittle-1:5000
bittle:
  robots:
    - id: bittle-1
      name: Laika
      type: bittle_x_v2
      service-url: http://localhost:15001
