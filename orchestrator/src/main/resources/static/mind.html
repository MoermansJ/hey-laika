<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mind</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%233498db%22/></svg>">
  <link rel="stylesheet" href="console.css">
  <script src="common.js"></script>
  <script src="cards.js"></script>
  <script src="nav.js" defer></script>
</head>
<body>
  <div class="topbar">
    <h1>Mind — what she is doing and why</h1>
    <select id="robot-select" title="Robot"></select>
    <span id="mind-chip" class="chip">…</span>
  </div>

  <div class="stack">
    <section class="card" id="arbiter-card"></section>

    <section class="card">
      <h2>Agent thoughts <span class="note">the personality loop's own reasoning</span></h2>
      <div id="thoughts" class="empty">…</div>
    </section>

    <div class="hint">Her position and the WiFi senses live on the Map tab; the signal leash on the Leash tab.</div>
  </div>

  <script>
    const $ = (sel) => document.querySelector(sel);
    const state = { base: "", arbiter: null };

    // The orchestrator's behavior loop stores every decision with its
    // reasoning (/behavior/history); this is the loop thinking out loud.
    function renderThoughts(decisions) {
      const el = $("#thoughts");
      if (!Array.isArray(decisions) || !decisions.length) {
        el.className = "empty";
        el.textContent = "no decisions yet — start the loop in the Behavior tab";
        return;
      }
      el.className = "";
      el.innerHTML = decisions.slice(0, 10).map((d) => {
        const at = d.decidedAt ? new Date(d.decidedAt).toLocaleTimeString() : "";
        const failed = d.success === false
            ? ` <span class="pill" style="color:var(--critical)">failed</span>` : "";
        return `<div class="why-line"><span class="cause mono">${esc(at)}</span> ` +
            `<span class="arrow">→</span> <b>${esc(d.selectedAction ?? "rest")}</b>` +
            `<span class="pill">${esc(d.source ?? "")}</span>${failed}` +
            `<div class="sub">${esc(d.reasoning ?? "")}</div></div>`;
      }).join("");
    }

    async function refresh() {
      const chip = $("#mind-chip");
      try {
        renderThoughts(await hlApi(state.base, "/behavior/history?limit=10"));
        chip.textContent = "live"; chip.className = "chip on";
      } catch (err) {
        chip.textContent = "orchestrator unreachable"; chip.className = "chip warn"; chip.title = err.message;
      }
    }

    function mount() {
      if (state.arbiter) state.arbiter.stop();
      state.arbiter = hlArbiterCard($("#arbiter-card"), state.base,
          { title: "What I'm doing, and why", runs: 12, why: true, intervalMs: 2000 });
      refresh();
    }

    async function boot() {
      let page;
      try {
        page = await hlPage({ onRobotChange: (id) => { state.base = `/api/robots/${id}`; mount(); } });
      } catch (err) {
        $("#mind-chip").textContent = "orchestrator unreachable";
        return;
      }
      if (!page.robotId) return;
      state.base = page.base;
      mount();
      hlPoll(refresh, 2000, { immediate: false });
    }
    boot();
  </script>
</body>
</html>
