<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%233498db%22/></svg>">
  <link rel="stylesheet" href="console.css">
  <style>
    .topbar { margin-bottom: 0.8rem; }
    input[type=datetime-local] { width: 12.5rem; }
    .filters { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: end; }
    .filters label { display: flex; flex-direction: column; gap: 0.2rem; font-size: 0.78rem; color: var(--ink-2); }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 0.9rem; margin-top: 0.9rem; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    .mapwrap { position: relative; }
    svg#map { width: 100%; height: min(70vh, 640px); display: block;
      background: #f7f9fa; border: 1px solid var(--ring); border-radius: 8px; }
    svg#map.nav { cursor: crosshair; }
    .tip { position: absolute; pointer-events: none; z-index: 5; display: none;
      background: rgba(44, 62, 80, 0.96); color: #fff; font-size: 0.76rem;
      padding: 0.5rem 0.65rem; border-radius: 8px; max-width: 300px; line-height: 1.35;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
    .tip b { color: #ffd479; }
    .tip .aps { margin-top: 0.3rem; border-top: 1px solid rgba(255,255,255,0.25); padding-top: 0.3rem; }
    .legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.78rem; color: var(--ink-2);
      margin-top: 0.5rem; align-items: center; }
    .legend .swatch { display: inline-block; width: 60px; height: 8px; border-radius: 4px;
      vertical-align: middle; margin: 0 0.3rem; box-shadow: none; border: none; }
    .legend .cell { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: middle; margin-right: 0.25rem; }
    .card table { font-size: 0.78rem; }
    .card th, .card td { white-space: nowrap; }
    tr.pick { cursor: pointer; }
    tr.pick:hover, tr.active { background: rgba(52, 152, 219, 0.1); }
    .scroll { max-height: 260px; overflow: auto; }
    #detail dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 0.15rem 0.6rem; font-size: 0.8rem; }
    #detail dt { color: var(--ink-2); }
    #detail dd { margin: 0; }
    .state { font-size: 0.78rem; color: var(--muted); min-height: 1em; }
    .navstate { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600;
      background: #ecf0f1; color: #2c3e50; }
    .navstate.moving, .navstate.planning { background: #d6eaf8; color: #1b4f72; }
    .navstate.arrived { background: #d5f5e3; color: #1e8449; }
    .navstate.blocked, .navstate.unreachable, .navstate.failed { background: #fdebd0; color: #7e5109; }
    .navstate.error { background: #fadbd8; color: #922b21; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0.35; } }
    .row { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; margin-top: 0.5rem; }
    .row input[type=text], .row input[type=number] { width: 7rem; }
    .errorbox { border: 1px solid #e74c3c; background: #fdf2f2; border-radius: 8px; padding: 0.6rem; margin-top: 0.5rem; font-size: 0.8rem; }
    .errorbox h3 { margin: 0 0 0.3rem; font-size: 0.85rem; color: #922b21; }
    .history { font-size: 0.76rem; margin-top: 0.5rem; }
    .history div { padding: 0.15rem 0; border-top: 1px solid var(--ring); }
    .history .res { color: #1e8449; }
    .history .open { color: #922b21; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Map — where she has been and what is in the way</h1>
    <select id="robot-select" title="Robot"></select>
    <span class="state" id="state"></span>
    <div class="spacer"></div>
    <label class="muted"><input type="checkbox" id="live" checked> live</label>
    <label class="muted" title="Click on the map to send her there"><input type="checkbox" id="navmode"> click to navigate</label>
    <button id="refresh">Refresh</button>
    <button id="sniff" class="primary" title="One WiFi scan now (blocks the dog ~2 s)">Sniff now</button>
    <button id="reset" class="danger" title="Re-anchor the origin: the dog is at its home spot">Reset origin</button>
  </div>

  <div class="card">
    <div class="filters">
      <label>Window
        <select id="window">
          <option value="3600">last hour</option>
          <option value="21600">last 6 h</option>
          <option value="86400" selected>last 24 h</option>
          <option value="604800">last 7 days</option>
          <option value="">all time</option>
          <option value="custom">custom…</option>
        </select>
      </label>
      <label>From <input type="datetime-local" id="since" disabled></label>
      <label>To <input type="datetime-local" id="until" disabled></label>
      <label>Source
        <select id="source">
          <option value="">auto + manual</option>
          <option value="auto">auto (sniffer)</option>
          <option value="manual">manual</option>
        </select>
      </label>
      <label>Min APs <input type="number" id="minAps" min="0" value="0"></label>
      <label>Every Nth <input type="number" id="every" min="1" value="1" title="Thin the trail: keep one sample in N"></label>
      <label>Max points <input type="number" id="limit" min="1" max="2000" value="500"></label>
      <label>Colour by
        <select id="colorBy"><option value="age">sample age</option></select>
      </label>
      <label>Layers
        <span>
          <label style="display:inline"><input type="checkbox" id="layerOccupancy" checked> occupancy</label>
          <label style="display:inline"><input type="checkbox" id="layerRoute" checked> route</label>
          <label style="display:inline"><input type="checkbox" id="layerTrail" checked> trail</label>
          <label style="display:inline"><input type="checkbox" id="layerGrid" checked> grid</label>
        </span>
      </label>
    </div>
  </div>

  <div class="layout">
    <div>
      <div class="mapwrap">
        <svg id="map" viewBox="0 0 800 600"></svg>
        <div class="tip" id="tip"></div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
    <div>
      <div class="card" id="nav-card">
        <h2>Navigation <span class="navstate" id="navstate">…</span></h2>
        <div id="nav-body" class="empty">…</div>
        <div class="row">
          <button id="cancel" class="danger" title="Stop the current route">Cancel route</button>
          <button id="sweep" title="Pan the head and scan the surroundings">Sonar sweep</button>
          <button id="clearmap" title="Forget the occupancy grid (samples stay)">Clear map</button>
        </div>
        <div class="row">
          <label class="muted"><input type="checkbox" id="avoid" checked> reactive stop at</label>
          <input type="number" id="stopCm" min="5" max="150" value="25" style="width:4.5rem"> cm
        </div>
        <div class="row">
          <input type="text" id="override" placeholder="kjmp" title="A skill to run with avoidance stood down">
          <button id="override-go" title="Run the skill; the reactive stop resumes when it ends">Override</button>
        </div>
      </div>
      <div class="card" style="margin-top:0.9rem" id="error-card">
        <h2>Errors</h2>
        <div id="error-body" class="empty">…</div>
        <div class="history" id="error-history"></div>
      </div>
      <div class="card" style="margin-top:0.9rem" id="sensor-card">
        <h2>Sensors now</h2>
        <div id="sensor-body" class="empty">…</div>
      </div>
      <div class="card" style="margin-top:0.9rem" id="pose-card"></div>
      <div class="card" style="margin-top:0.9rem">
        <h2>Selected sample</h2>
        <div id="detail" class="empty">Hover a point for a quick look, click to pin it here.</div>
      </div>
      <div class="card" style="margin-top:0.9rem">
        <h2>Collected</h2>
        <div id="summary"></div>
        <div class="scroll" style="margin-top:0.5rem">
          <table id="aps"><thead><tr><th>Network</th><th>Heard</th><th>Best</th><th>Worst</th></tr></thead><tbody></tbody></table>
        </div>
        <div class="muted" style="margin-top:0.4rem">Click a network to colour the map by its signal.</div>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="cards.js"></script>
  <script src="nav.js" defer></script>
  <script>
    let BASE = "";           // set by boot() from hlPage
    let poseCard = null;

    const $ = (id) => document.getElementById(id);
    const W = 800, H = 600, PAD = 40;
    let samples = [];          // newest first, as served
    let pose = null;
    let status = null;
    let nav = null;            // /navigation status
    let grid = null;           // /navigation/map
    let pinned = null;         // sample id pinned in the detail card
    let colorBy = "age";       // "age" or a BSSID
    let view = null;           // world <-> screen mapping

    // ---- filters ---------------------------------------------------------

    function toLocalInput(epochS) {
      const d = new Date(epochS * 1000);
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function filterQuery() {
      const q = new URLSearchParams();
      const win = $("window").value;
      const now = Date.now() / 1000;
      if (win === "custom") {
        if ($("since").value) q.set("since", Date.parse($("since").value) / 1000);
        if ($("until").value) q.set("until", Date.parse($("until").value) / 1000);
      } else if (win) {
        q.set("since", Math.floor(now - Number(win)));
      }
      if ($("source").value) q.set("source", $("source").value);
      const minAps = parseInt($("minAps").value, 10);
      if (minAps > 0) q.set("minAps", minAps);
      const every = parseInt($("every").value, 10);
      if (every > 1) q.set("every", every);
      q.set("limit", Math.min(2000, Math.max(1, parseInt($("limit").value, 10) || 500)));
      return `?${q.toString()}`;
    }

    $("window").addEventListener("change", () => {
      const custom = $("window").value === "custom";
      $("since").disabled = $("until").disabled = !custom;
      if (custom && !$("since").value) {
        $("since").value = toLocalInput(Date.now() / 1000 - 86400);
        $("until").value = toLocalInput(Date.now() / 1000);
      }
      refresh();
    });
    ["since", "until", "source", "minAps", "every", "limit"].forEach((id) =>
      $(id).addEventListener("change", refresh));
    ["layerTrail", "layerGrid", "layerOccupancy", "layerRoute"].forEach((id) => $(id).addEventListener("change", draw));
    $("colorBy").addEventListener("change", () => { colorBy = $("colorBy").value; draw(); });
    $("navmode").addEventListener("change", () => $("map").classList.toggle("nav", $("navmode").checked));

    // ---- colour scales ---------------------------------------------------

    function lerp(a, b, t) { return a + (b - a) * t; }
    function mix(c1, c2, t) {
      return `rgb(${Math.round(lerp(c1[0], c2[0], t))},${Math.round(lerp(c1[1], c2[1], t))},${Math.round(lerp(c1[2], c2[2], t))})`;
    }
    const FRESH = [52, 152, 219], STALE = [189, 195, 199];
    const STRONG = [39, 174, 96], WEAK = [231, 76, 60];

    function ageColor(s, tMin, tMax) {
      const span = Math.max(1, tMax - tMin);
      return mix(STALE, FRESH, (s.t - tMin) / span);
    }

    function rssiColor(dbm) {
      const t = Math.max(0, Math.min(1, (dbm + 90) / 50));   // -90 .. -40
      return mix(WEAK, STRONG, t);
    }

    function apRssi(s, bssid) {
      const ap = s.aps.find((a) => a.bssid === bssid);
      return ap ? ap.rssi : null;
    }

    // ---- geometry --------------------------------------------------------

    function fitView() {
      const xs = samples.map((s) => s.x), ys = samples.map((s) => s.y);
      if (pose) { xs.push(pose.x); ys.push(pose.y); }
      if (grid && grid.bounds && $("layerOccupancy").checked) {
        const r = grid.resolutionM;
        xs.push(grid.bounds.minCx * r, (grid.bounds.maxCx + 1) * r);
        ys.push(grid.bounds.minCy * r, (grid.bounds.maxCy + 1) * r);
      }
      if (nav && nav.target) { xs.push(nav.target.x); ys.push(nav.target.y); }
      if (!xs.length) { xs.push(0); ys.push(0); }
      let minX = Math.min(...xs), maxX = Math.max(...xs);
      let minY = Math.min(...ys), maxY = Math.max(...ys);
      const spanX = Math.max(2, maxX - minX), spanY = Math.max(2, maxY - minY);
      const scale = Math.min((W - 2 * PAD) / spanX, (H - 2 * PAD) / spanY);
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
      // World: x east, y north (heading 0 = +x, left turn = +deg). Screen y is flipped.
      view = {
        scale, cx, cy,
        sx: (x) => W / 2 + (x - cx) * scale,
        sy: (y) => H / 2 - (y - cy) * scale,
        wx: (X) => cx + (X - W / 2) / scale,
        wy: (Y) => cy - (Y - H / 2) / scale,
        minX: cx - (W / 2) / scale, maxX: cx + (W / 2) / scale,
        minY: cy - (H / 2) / scale, maxY: cy + (H / 2) / scale,
      };
    }

    function gridStep() {
      const spanM = (view.maxX - view.minX);
      if (spanM > 40) return 10;
      if (spanM > 16) return 5;
      if (spanM > 8) return 2;
      if (spanM > 3) return 1;
      return 0.5;
    }

    // ---- drawing ---------------------------------------------------------

    function cellColor(state, logodds) {
      const t = Math.min(1, Math.abs(logodds) / 3);
      if (state === "o") return `rgba(44, 62, 80, ${0.45 + 0.5 * t})`;
      return `rgba(46, 204, 113, ${0.10 + 0.25 * t})`;
    }

    function draw() {
      fitView();
      const svg = $("map");
      let html = "";
      if ($("layerOccupancy").checked && grid && grid.cells && grid.cells.length) {
        const r = grid.resolutionM;
        const size = Math.max(1, r * view.scale);
        html += `<g pointer-events="none">`;
        grid.cells.forEach(([cx, cy, state, lo]) => {
          const X = view.sx(cx * r), Y = view.sy((cy + 1) * r);
          html += `<rect x="${X.toFixed(1)}" y="${Y.toFixed(1)}" width="${size.toFixed(1)}" height="${size.toFixed(1)}" fill="${cellColor(state, lo)}"/>`;
        });
        html += `</g>`;
      }
      if ($("layerGrid").checked) {
        const step = gridStep();
        for (let gx = Math.ceil(view.minX / step) * step; gx <= view.maxX; gx += step) {
          const X = view.sx(gx).toFixed(1);
          const major = Math.abs(gx) < 1e-9;
          html += `<line x1="${X}" x2="${X}" y1="0" y2="${H}" stroke="${major ? "#95a5a6" : "#e3e8ea"}" stroke-width="${major ? 1.2 : 1}"/>`;
          html += `<text x="${X}" y="${H - 6}" font-size="10" fill="#95a5a6" text-anchor="middle">${+gx.toFixed(1)} m</text>`;
        }
        for (let gy = Math.ceil(view.minY / step) * step; gy <= view.maxY; gy += step) {
          const Y = view.sy(gy).toFixed(1);
          const major = Math.abs(gy) < 1e-9;
          html += `<line x1="0" x2="${W}" y1="${Y}" y2="${Y}" stroke="${major ? "#95a5a6" : "#e3e8ea"}" stroke-width="${major ? 1.2 : 1}"/>`;
          html += `<text x="6" y="${(+Y - 3).toFixed(1)}" font-size="10" fill="#95a5a6">${+gy.toFixed(1)} m</text>`;
        }
      }
      // Chronological order for the trail (server returns newest first).
      const chrono = samples.slice().reverse();
      if ($("layerTrail").checked && chrono.length > 1) {
        const pts = chrono.map((s) => `${view.sx(s.x).toFixed(1)},${view.sy(s.y).toFixed(1)}`).join(" ");
        html += `<polyline points="${pts}" fill="none" stroke="#7f8c8d" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="3 3"/>`;
      }
      const tMin = chrono.length ? chrono[0].t : 0, tMax = chrono.length ? chrono[chrono.length - 1].t : 1;
      if ($("layerTrail").checked) chrono.forEach((s) => {
        let fill, r = 5, extra = "";
        if (colorBy === "age") {
          fill = ageColor(s, tMin, tMax);
        } else {
          const dbm = apRssi(s, colorBy);
          if (dbm == null) { fill = "#ffffff"; extra = ' stroke="#bdc3c7" stroke-width="1"'; r = 3.5; }
          else fill = rssiColor(dbm);
        }
        const active = pinned === s.id;
        html += `<circle class="pt" data-id="${s.id}" cx="${view.sx(s.x).toFixed(1)}" cy="${view.sy(s.y).toFixed(1)}" r="${active ? r + 3 : r}" fill="${fill}"${extra}${active ? ' stroke="#2c3e50" stroke-width="2"' : ""}/>`;
      });
      if ($("layerRoute").checked && nav) {
        html += `<g pointer-events="none">`;
        if (nav.route && nav.route.waypoints && nav.route.waypoints.length && pose) {
          const pts = [[pose.x, pose.y], ...nav.route.waypoints]
            .map(([x, y]) => `${view.sx(x).toFixed(1)},${view.sy(y).toFixed(1)}`).join(" ");
          html += `<polyline points="${pts}" fill="none" stroke="#2980b9" stroke-width="2" stroke-dasharray="6 4"/>`;
          nav.route.waypoints.forEach(([x, y], i) => {
            html += `<circle cx="${view.sx(x).toFixed(1)}" cy="${view.sy(y).toFixed(1)}" r="4" fill="${i < nav.route.legIndex ? "#bdc3c7" : "#2980b9"}"/>`;
          });
        }
        if (nav.target) {
          const X = view.sx(nav.target.x), Y = view.sy(nav.target.y);
          html += `<g stroke="#8e44ad" stroke-width="2"><circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="9" fill="rgba(142,68,173,0.15)"/>` +
            `<line x1="${(X - 13).toFixed(1)}" x2="${(X + 13).toFixed(1)}" y1="${Y.toFixed(1)}" y2="${Y.toFixed(1)}"/>` +
            `<line x1="${X.toFixed(1)}" x2="${X.toFixed(1)}" y1="${(Y - 13).toFixed(1)}" y2="${(Y + 13).toFixed(1)}"/></g>`;
          html += `<text x="${(X + 12).toFixed(1)}" y="${(Y - 12).toFixed(1)}" font-size="11" fill="#8e44ad" font-weight="600">target</text>`;
        }
        if (nav.lastBlock && Date.now() / 1000 - nav.lastBlock.at < 300) {
          const rad = nav.lastBlock.heading * Math.PI / 180, d = nav.lastBlock.rangeCm / 100;
          const X = view.sx(nav.lastBlock.x + Math.cos(rad) * d), Y = view.sy(nav.lastBlock.y + Math.sin(rad) * d);
          html += `<g stroke="#e74c3c" stroke-width="2"><line x1="${(X - 6).toFixed(1)}" x2="${(X + 6).toFixed(1)}" y1="${(Y - 6).toFixed(1)}" y2="${(Y + 6).toFixed(1)}"/>` +
            `<line x1="${(X - 6).toFixed(1)}" x2="${(X + 6).toFixed(1)}" y1="${(Y + 6).toFixed(1)}" y2="${(Y - 6).toFixed(1)}"/></g>`;
        }
        html += `</g>`;
      }
      if (pose) {
        // The marker never intercepts the pointer: the newest sample sits
        // right under it and must stay hoverable.
        const X = view.sx(pose.x), Y = view.sy(pose.y);
        const radius = Math.max(8, Math.min(200, (pose.driftM || 0) * view.scale));
        html += `<g pointer-events="none">`;
        html += `<circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="${radius.toFixed(1)}" fill="rgba(231,76,60,0.08)" stroke="#e74c3c" stroke-dasharray="4 3" stroke-width="1"/>`;
        // Screen rotation is clockwise; world heading is counter-clockwise.
        html += `<g transform="translate(${X.toFixed(1)} ${Y.toFixed(1)}) rotate(${(-pose.heading).toFixed(1)})">` +
          `<polygon points="14,0 -8,-8 -4,0 -8,8" fill="#e74c3c" stroke="#fff" stroke-width="1.5"/></g>`;
        html += `<text x="${(X + 14).toFixed(1)}" y="${(Y - 12).toFixed(1)}" font-size="11" fill="#c0392b" font-weight="600">Laika</text>`;
        html += `</g>`;
      }
      svg.innerHTML = html;
      drawLegend(tMin, tMax);
    }

    function drawLegend(tMin, tMax) {
      const el = $("legend");
      let html = "";
      if ($("layerOccupancy").checked) {
        html += `<span><span class="cell" style="background:rgba(46,204,113,0.3)"></span>seen floor</span>` +
          `<span><span class="cell" style="background:rgba(44,62,80,0.8)"></span>obstacle (darker = surer)</span>`;
      }
      if ($("layerRoute").checked) html += `<span style="color:#2980b9">– – route</span><span style="color:#8e44ad">⊕ target</span><span style="color:#e74c3c">✕ last stop</span>`;
      if (colorBy === "age") {
        html += samples.length
          ? `<span>older <span class="swatch" style="background:linear-gradient(90deg, rgb(189,195,199), rgb(52,152,219))"></span> newer</span>` +
            `<span>${new Date(tMin * 1000).toLocaleString()} → ${new Date(tMax * 1000).toLocaleString()}</span>`
          : "";
      } else {
        const name = apName(colorBy);
        html += `<span>${esc(name)}: weak <span class="swatch" style="background:linear-gradient(90deg, rgb(231,76,60), rgb(39,174,96))"></span> strong (−90 … −40 dBm)</span>` +
          `<span>hollow = not heard there</span>`;
      }
      html += `<span>▲ last known position, dashed ring = dead-reckoning uncertainty</span>`;
      el.innerHTML = html;
    }

    // ---- hover / pin / click-to-navigate ---------------------------------

    const byId = () => new Map(samples.map((s) => [s.id, s]));

    function sampleHtml(s, compact) {
      const when = new Date(s.t * 1000);
      const aps = s.aps.slice().sort((a, b) => b.rssi - a.rssi);
      const shown = compact ? aps.slice(0, 6) : aps;
      const rows = shown.map((a) =>
        `${esc(a.ssid || "(hidden)")} <span style="opacity:.75">${esc(a.bssid)}</span> ${a.rssi} dBm` +
        (a.channel != null ? ` ch${a.channel}` : "")).join("<br>");
      const more = aps.length > shown.length ? `<br>… +${aps.length - shown.length} more` : "";
      return `<b>#${s.id}</b> ${esc(when.toLocaleString())} <span style="opacity:.75">(${esc(s.source)})</span><br>` +
        `pose (${s.x}, ${s.y}) m · heading ${s.heading}° · ±${s.driftM} m` +
        (s.yaw != null ? ` · IMU yaw ${s.yaw}°` : "") +
        (s.battery != null ? ` · battery ${s.battery}%` : "") +
        `<div class="aps">${aps.length} network${aps.length === 1 ? "" : "s"}<br>${rows}${more}</div>`;
    }

    const tip = $("tip");
    $("map").addEventListener("mousemove", (ev) => {
      const target = ev.target.closest && ev.target.closest("circle.pt");
      if (!target) { tip.style.display = "none"; return; }
      const s = byId().get(Number(target.dataset.id));
      if (!s) return;
      tip.innerHTML = sampleHtml(s, true);
      tip.style.display = "block";
      const wrap = $("map").getBoundingClientRect();
      let left = ev.clientX - wrap.left + 14, top = ev.clientY - wrap.top + 14;
      if (left + 310 > wrap.width) left = ev.clientX - wrap.left - 314;
      if (top + tip.offsetHeight > wrap.height) top = Math.max(0, ev.clientY - wrap.top - tip.offsetHeight - 10);
      tip.style.left = `${left}px`; tip.style.top = `${top}px`;
    });
    $("map").addEventListener("mouseleave", () => { tip.style.display = "none"; });

    function worldAt(ev) {
      const svg = $("map");
      const pt = svg.createSVGPoint();
      pt.x = ev.clientX; pt.y = ev.clientY;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      return { x: view.wx(p.x), y: view.wy(p.y) };
    }

    $("map").addEventListener("click", async (ev) => {
      const target = ev.target.closest && ev.target.closest("circle.pt");
      if (target) {
        pinned = Number(target.dataset.id);
        renderDetail();
        draw();
        return;
      }
      pinned = null;
      renderDetail();
      if (!$("navmode").checked || !view) { draw(); return; }
      const w = worldAt(ev);
      setState(`going to (${w.x.toFixed(2)}, ${w.y.toFixed(2)})…`);
      try {
        const out = await hlApi(BASE, "/navigation/target", { method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ x: +w.x.toFixed(2), y: +w.y.toFixed(2) }) });
        setState(`target set: ${out.status}`);
        await refreshNav();
      } catch (err) { setState(`target refused: ${err.message}`, true); }
    });

    function renderDetail() {
      const el = $("detail");
      const s = pinned != null ? byId().get(pinned) : null;
      if (!s) {
        el.className = "empty";
        el.textContent = "Hover a point for a quick look, click to pin it here.";
        return;
      }
      el.className = "";
      const aps = s.aps.slice().sort((a, b) => b.rssi - a.rssi);
      el.innerHTML = `<dl>` +
        `<dt>Sample</dt><dd>#${s.id} (${esc(s.source)})</dd>` +
        `<dt>Time</dt><dd>${esc(new Date(s.t * 1000).toLocaleString())}</dd>` +
        `<dt>Position</dt><dd>${s.x}, ${s.y} m</dd>` +
        `<dt>Heading</dt><dd>${s.heading}°${s.yaw != null ? ` (IMU yaw ${s.yaw}°)` : ""}</dd>` +
        `<dt>Uncertainty</dt><dd>±${s.driftM} m</dd>` +
        `<dt>Battery</dt><dd>${s.battery != null ? s.battery + "%" : "—"}</dd>` +
        `</dl>` +
        `<table style="margin-top:0.5rem"><thead><tr><th>Network</th><th>RSSI</th><th>Ch</th></tr></thead><tbody>` +
        aps.map((a) => `<tr><td>${esc(a.ssid || "(hidden)")}<br><span class="muted">${esc(a.bssid)}</span></td>` +
          `<td>${a.rssi} dBm</td><td>${a.channel ?? "—"}</td></tr>`).join("") +
        `</tbody></table>`;
    }

    // ---- navigation cards ------------------------------------------------

    function renderNav() {
      const badge = $("navstate");
      const body = $("nav-body");
      if (!nav) { badge.textContent = "offline"; badge.className = "navstate"; body.className = "empty"; body.textContent = "navigation unavailable"; return; }
      badge.textContent = nav.state;
      badge.className = `navstate ${nav.state}`;
      body.className = "";
      const t = nav.target, f = nav.finished, r = nav.route;
      const legs = r && r.waypoints ? `${Math.min(r.legIndex + 1, r.waypoints.length)} / ${r.waypoints.length}` : "—";
      body.innerHTML =
        `<div class="stat"><span>Target</span><span class="mono">${t ? `${t.x}, ${t.y} m` : "—"}</span></div>` +
        `<div class="stat"><span>Remaining</span><span>${nav.remainingM != null ? nav.remainingM + " m" : "—"}</span></div>` +
        `<div class="stat"><span>Leg</span><span>${legs}</span></div>` +
        `<div class="stat"><span>Blocked / replans</span><span>${nav.blockedCount} / ${nav.replans}</span></div>` +
        `<div class="stat"><span>Reactive stops</span><span>${nav.avoidance.stops}${nav.avoidance.suppressed ? " (stood down)" : ""}${nav.avoidance.rangerEnabled ? "" : " · no ranger"}</span></div>` +
        `<div class="stat"><span>Map</span><span>${nav.map.grid.free} floor · ${nav.map.grid.occupied} obstacle cells</span></div>` +
        (f ? `<div class="muted" style="margin-top:0.3rem">Last: ${esc(f.state)}${f.detail ? " — " + esc(f.detail) : ""} (${esc(new Date(f.at * 1000).toLocaleTimeString())})</div>` : "") +
        (nav.away ? `<div class="muted">Away mode: navigation is off until the leash is released.</div>` : "");
      if (document.activeElement !== $("stopCm")) $("stopCm").value = nav.avoidance.stopCm;
      $("avoid").checked = nav.avoidance.enabled;
      $("cancel").disabled = !nav.active;
    }

    function renderSensors() {
      const body = $("sensor-body");
      const s = nav && nav.sensors;
      const l = s && s.latest;
      if (!l) { body.className = "empty"; body.textContent = "no reading yet (she samples while moving)"; return; }
      body.className = "";
      const age = Math.max(0, Date.now() / 1000 - l.t);
      body.innerHTML =
        `<div class="stat"><span>Range ahead</span><span>${l.rangeCm == null ? (l.gated ? "paused (battery saver)" : "no echo") : Math.round(l.rangeCm) + " cm"}${l.panDeg ? ` (head ${l.panDeg}°)` : ""}</span></div>` +
        `<div class="stat"><span>Heading / IMU yaw</span><span>${l.heading}° / ${l.yaw != null ? l.yaw + "°" : "—"}</span></div>` +
        `<div class="stat"><span>Battery</span><span>${l.battery != null ? Math.round(l.battery) + "%" : "—"}</span></div>` +
        `<div class="stat"><span>In flight</span><span class="mono">${esc(l.command || "—")}${l.behavior ? ` (${esc(l.behavior)})` : ""}</span></div>` +
        `<div class="stat"><span>Loop</span><span>${s.rateHz != null ? s.rateHz + " Hz" : "idle"} · ${s.recorded} readings · ${age < 60 ? Math.round(age) + " s ago" : "stale"}</span></div>`;
    }

    let errorHistory = [];
    function renderErrors() {
      const body = $("error-body");
      const e = nav && nav.errors;
      if (!e) { body.className = "empty"; body.textContent = "—"; return; }
      body.className = "";
      if (e.active) {
        const a = e.active;
        body.innerHTML = `<div class="errorbox"><h3>${esc(a.kind)} — waiting ${Math.round(a.waitingS)} s</h3>` +
          `<div>${esc(a.message)}</div>` +
          `<div class="muted" style="margin-top:0.3rem">${esc(a.prompt)}</div>` +
          `<div class="row"><input type="text" id="note" placeholder="note (optional)" style="width:100%"></div>` +
          `<div class="row">` +
          `<button data-choice="trust_sensor" class="primary" title="The obstacle is real: put it on the map">Sensor is right</button>` +
          `<button data-choice="trust_map" title="The reading was wrong: keep the map">Map is right</button>` +
          `<button data-choice="manual" title="I moved her by hand: forget the route, then reset the origin if needed">I moved her</button>` +
          `</div></div>`;
        body.querySelectorAll("button[data-choice]").forEach((b) => b.addEventListener("click", async () => {
          try {
            await hlApi(BASE, "/navigation/errors/respond", { method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ choice: b.dataset.choice, note: $("note").value || null }) });
            await refreshNav();
          } catch (err) { setState(`answer failed: ${err.message}`, true); }
        }));
      } else {
        const h = e.handler || {};
        const streaks = Object.entries(h.streaks || {}).map(([k, v]) => `${k} ×${v}`).join(", ");
        body.innerHTML = `<div class="stat"><span>State</span><span>no open error</span></div>` +
          `<div class="stat"><span>Retrying</span><span>${streaks || "—"}</span></div>` +
          `<div class="stat"><span>Silent recoveries / escalations</span><span>${h.silentRecoveries ?? 0} / ${h.escalated ?? 0}</span></div>`;
      }
      $("error-history").innerHTML = errorHistory.slice(0, 8).map((row) =>
        `<div><span class="${row.resolution ? "res" : row.tier === "unrecoverable" ? "open" : ""}">${esc(row.tier === "unrecoverable" ? "⚠" : "·")} ${esc(row.kind)}</span> ` +
        `${esc(new Date(row.t * 1000).toLocaleTimeString())}${row.retries ? ` (try ${row.retries})` : ""}` +
        `${row.resolution ? ` → ${esc(row.resolution)}` : ""}</div>`).join("");
    }

    // ---- side cards ------------------------------------------------------

    const apNames = new Map();
    function apName(bssid) {
      const n = apNames.get(bssid);
      return n ? `${n} (${bssid})` : bssid;
    }

    function renderSummary(meta) {
      const agg = new Map();
      samples.forEach((s) => s.aps.forEach((a) => {
        const e = agg.get(a.bssid) || { ssid: a.ssid, bssid: a.bssid, heard: 0, best: -999, worst: 0 };
        e.heard += 1; e.best = Math.max(e.best, a.rssi); e.worst = Math.min(e.worst, a.rssi);
        if (!e.ssid && a.ssid) e.ssid = a.ssid;
        agg.set(a.bssid, e);
      }));
      apNames.clear();
      agg.forEach((e) => apNames.set(e.bssid, e.ssid));
      const list = [...agg.values()].sort((a, b) => b.heard - a.heard || b.best - a.best);

      const tSpan = samples.length
        ? `${new Date(samples[samples.length - 1].t * 1000).toLocaleString()} → ${new Date(samples[0].t * 1000).toLocaleString()}`
        : "—";
      $("summary").innerHTML =
        `<div class="stat"><span>Shown / matched / stored</span><span>${meta.returned} / ${meta.matched} / ${meta.total}</span></div>` +
        `<div class="stat"><span>Time span shown</span><span>${esc(tSpan)}</span></div>` +
        `<div class="stat"><span>Distinct networks</span><span>${list.length}</span></div>` +
        (meta.matched > meta.returned
          ? `<div class="muted" style="margin-top:0.3rem">Thinned: raise “Max points” or use “Every Nth” to spread the window.</div>` : "");

      const select = $("colorBy");
      const keep = colorBy;
      select.innerHTML = `<option value="age">sample age</option>` +
        list.map((e) => `<option value="${esc(e.bssid)}">${esc(e.ssid || "(hidden)")} · ${esc(e.bssid)}</option>`).join("");
      if ([...select.options].some((o) => o.value === keep)) select.value = keep; else { colorBy = "age"; select.value = "age"; }

      const tbody = $("aps").querySelector("tbody");
      tbody.innerHTML = list.map((e) =>
        `<tr class="pick${colorBy === e.bssid ? " active" : ""}" data-bssid="${esc(e.bssid)}">` +
        `<td>${esc(e.ssid || "(hidden)")}<br><span class="muted">${esc(e.bssid)}</span></td>` +
        `<td>${e.heard}×</td><td>${e.best} dBm</td><td>${e.worst} dBm</td></tr>`).join("");
      tbody.querySelectorAll("tr.pick").forEach((tr) => tr.addEventListener("click", () => {
        colorBy = colorBy === tr.dataset.bssid ? "age" : tr.dataset.bssid;
        select.value = colorBy;
        tbody.querySelectorAll("tr.pick").forEach((row) => row.classList.toggle("active", row.dataset.bssid === colorBy));
        draw();
      }));
    }

    // ---- data ------------------------------------------------------------

    function setState(text, isError) {
      const el = $("state");
      el.textContent = text || "";
      el.style.color = isError ? "var(--critical)" : "var(--muted)";
    }

    async function refreshNav() {
      try {
        const [n, g, e] = await Promise.all([
          hlApi(BASE, "/navigation"), hlApi(BASE, "/navigation/map"),
          hlApi(BASE, "/navigation/errors?limit=8"),
        ]);
        nav = n; grid = g; errorHistory = e.history || [];
        if (g.pose) pose = g.pose;
      } catch (err) {
        nav = null; grid = null;
      }
      renderNav(); renderSensors(); renderErrors(); draw();
    }

    async function refresh() {
      try {
        const [page, st] = await Promise.all([
          hlApi(BASE, `/senses/samples${filterQuery()}`),
          hlApi(BASE, "/senses"),
        ]);
        samples = page.samples || [];
        pose = page.pose || st.pose || null;
        status = st;
        if (pinned != null && !samples.some((s) => s.id === pinned)) pinned = null;
        if (poseCard) poseCard.render(st);
        renderSummary(page);
        renderDetail();
        await refreshNav();
        setState(`updated ${new Date().toLocaleTimeString()}`);
      } catch (err) {
        setState(`offline: ${err.message}`, true);
      }
    }

    async function post(path, body, label) {
      try {
        const out = await hlApi(BASE, path, { method: "POST",
          headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
        setState(`${label}: ${out.status || out.state || "ok"}`);
        await refreshNav();
        return out;
      } catch (err) { setState(`${label} failed: ${err.message}`, true); }
    }

    $("refresh").addEventListener("click", refresh);
    $("sniff").addEventListener("click", async () => {
      setState("sniffing…");
      try {
        const out = await hlApi(BASE, "/senses/sniff", { method: "POST" });
        pinned = out.sample ? out.sample.id : pinned;
        await refresh();
      } catch (err) { setState(`sniff failed: ${err.message}`, true); }
    });
    $("reset").addEventListener("click", async () => {
      if (!confirm("Reset the map origin to the dog's current spot? Existing samples keep their coordinates.")) return;
      try {
        await hlApi(BASE, "/senses/pose/reset", { method: "POST",
          headers: { "Content-Type": "application/json" }, body: "{}" });
        await refresh();
      } catch (err) { setState(`reset failed: ${err.message}`, true); }
    });
    $("cancel").addEventListener("click", () => post("/navigation/cancel", {}, "cancel"));
    $("sweep").addEventListener("click", () => post("/navigation/sweep", {}, "sweep"));
    $("clearmap").addEventListener("click", () => {
      if (confirm("Forget the occupancy grid? Fingerprint samples are kept.")) post("/navigation/map/reset", {}, "clear map");
    });
    $("avoid").addEventListener("change", () => post("/navigation/config", { avoidanceEnabled: $("avoid").checked }, "avoidance"));
    $("stopCm").addEventListener("change", () => post("/navigation/config", { stopCm: Number($("stopCm").value) }, "stop distance"));
    $("override-go").addEventListener("click", () => {
      const command = $("override").value.trim();
      if (command) post("/navigation/override", { command }, "override");
    });

    let poller = null;

    function mount(base) {
      BASE = base;
      samples = []; pose = null; status = null; nav = null; grid = null; pinned = null;
      if (poseCard) poseCard.stop();
      poseCard = hlPoseCard($("pose-card"), BASE, { title: "Where she thinks she is" });
      if (poller) poller.tick(); else {
        // Samples every 10 s; the navigation cards and map every 2 s, or
        // every second while a route is running.
        let ticks = 0;
        poller = hlPoll(async () => {
          if (!$("live").checked) return;
          ticks += 1;
          if (ticks % 10 === 1) await refresh();
          else if (nav && nav.active) await refreshNav();
          else if (ticks % 2 === 0) await refreshNav();
        }, 1000);
        $("live").addEventListener("change", () => { if ($("live").checked) poller.tick(); });
      }
    }

    (async function boot() {
      let page;
      try {
        page = await hlPage({ onRobotChange: (id) => mount(`/api/robots/${id}`) });
      } catch (err) { setState(`orchestrator unreachable: ${err.message}`, true); return; }
      if (!page.robotId) return;
      mount(page.base);
    })();
  </script>
</body>
</html>
