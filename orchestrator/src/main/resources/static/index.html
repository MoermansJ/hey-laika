<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bittle Fleet Console</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%233498db%22/></svg>">
</head>
<body>
  <button id="sidebar-open" class="sidebar-open" title="Menu">&#9776;</button>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="title-block">
        <h1>Bittle Fleet</h1>
        <span class="version">management console</span>
      </div>
      <button id="sidebar-collapse" class="sidebar-collapse"
              title="Collapse sidebar">&#9776;</button>
    </div>

    <div class="nav-menu">
      <a href="#dashboard" class="nav-link" data-page="dashboard">
        <span class="label">Dashboard</span>
      </a>

      <div class="nav-separator">Robots</div>
      <div id="nav-robots"></div>

      <div class="nav-separator">System</div>
      <div class="nav-widget">
        <div class="nav-widget-title">Orchestrator</div>
        <div id="nav-health" class="nav-widget-body">loading</div>
      </div>
      <div class="nav-widget">
        <div class="nav-widget-title">Transport</div>
        <div id="nav-transport" class="nav-widget-body">connecting</div>
      </div>
    </div>
  </nav>

  <main class="main-content">

    <section id="page-dashboard" class="page">
      <div class="page-header">
        <h2>Dashboard</h2>
      </div>
      <div id="robot-grid" class="robot-grid"></div>
    </section>

    <section id="page-robot" class="page hidden">
      <div class="page-header detail-header">
        <h2 id="robot-title"></h2>
        <span id="robot-chip-conn" class="chip"></span>
        <span id="robot-chip-mood" class="chip"></span>
        <span id="robot-chip-mode" class="chip"></span>
        <span id="robot-chip-uptime" class="chip" title="Smooth uptime derived from the adapter's boot epoch"></span>
        <span id="sys-clock" class="chip" title="This browser's clock, to compare with the timestamps below"></span>
      </div>

      <!-- Tabs and their frames are generated by app.js from the TABS registry:
           one list decides the order, the labels and which page each tab embeds. -->
      <div class="tab-bar" id="tab-bar" role="tablist" aria-label="Robot sections"></div>

      <div id="robot-tab-activity" class="robot-tab">
        <div class="panel panel-wide" id="arbiter-card"></div>
        <div class="panel panel-wide">
          <h3>Activity</h3>
          <ul id="activity" class="activity-feed"></ul>
        </div>
      </div>

      <div id="robot-tab-specs" class="robot-tab hidden">
        <div class="panel panel-wide">
          <h3>Polling
            <span class="muted" style="float:right" id="polling-state"></span>
          </h3>
          <div class="polling-row">
            <label>Telemetry TTL (s) <input type="number" id="poll-ttl" min="5"></label>
            <label>Battery poll (s) <input type="number" id="poll-batt" min="5"></label>
            <label>Idle multiplier <input type="number" id="poll-mult" min="1" step="0.5"></label>
            <label>Idle postures <input type="text" id="poll-postures" placeholder="rest, sit, lnd"></label>
            <button id="poll-save" class="btn-small">Save</button>
          </div>
        </div>
        <div id="specs-content"></div>
      </div>

      <div id="robot-frames"></div>
    </section>

  </main>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="vendor/stomp.umd.min.js"></script>
  <script src="common.js"></script>
  <script src="cards.js"></script>
  <script src="specs.js"></script>
  <script src="app.js"></script>
</body>
</html>
