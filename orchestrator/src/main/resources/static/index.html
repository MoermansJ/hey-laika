<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bittle Fleet Console</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%233498db%22/></svg>">
</head>
<body>
  <!-- Legacy sidebar: kept in the DOM (hidden) so app.js's existing queries
       (#nav-robots, #nav-health, #nav-transport, #sidebar-open/-collapse)
       keep working untouched. Superseded by .topnav below. -->
  <button id="sidebar-open" class="sidebar-open hidden" title="Menu">&#9776;</button>

  <nav class="sidebar hidden" id="sidebar">
    <div class="sidebar-header">
      <div class="title-block">
        <h1>Bittle Fleet</h1>
        <span class="version">management console</span>
      </div>
      <button id="sidebar-collapse" class="sidebar-collapse"
              title="Collapse sidebar">&#9776;</button>
    </div>

    <div class="nav-menu">
      <a href="#dashboard" class="nav-link" data-page="dashboard">
        <span class="label">Dashboard</span>
      </a>

      <div class="nav-separator">Robots</div>
      <div id="nav-robots"></div>

      <div class="nav-separator">System</div>
      <div class="nav-widget">
        <div class="nav-widget-title">Orchestrator</div>
        <div id="nav-health" class="nav-widget-body">loading</div>
      </div>
      <div class="nav-widget">
        <div class="nav-widget-title">Transport</div>
        <div id="nav-transport" class="nav-widget-body">connecting</div>
      </div>
    </div>
  </nav>

  <nav class="topnav">
    <div class="devmode-group">
      <button type="button" class="sense-card devmode-button" id="devmode-toggle"
              title="Show the Mocha dev fixture card">DEV MODE</button>
      <button type="button" id="devmode-settings-toggle" class="sense-card devmode-chevron"
              aria-expanded="false" aria-controls="devmode-settings" title="Dev mode settings">
        <span class="devmode-chevron-glyph">&#9662;</span>
      </button>
      <div class="devmode-settings hidden" id="devmode-settings">
        <button type="button" class="sense-card devmode-setting" id="devmode-audio-toast">Audio toast</button>
        <div class="devmode-setting-row">
          <button type="button" class="sense-card devmode-setting" id="devmode-led-toast">LED toast</button>
          <input type="color" id="devmode-led-toast-color" class="devmode-color-picker" title="LED toast colour">
        </div>
        <button type="button" class="sense-card devmode-setting" id="devmode-clear-error"
                title="Dismiss the active navigation error (map_contradiction, sensor_anomaly, ...) without touching the map">Clear error state</button>
        <button type="button" class="sense-card devmode-setting" id="devmode-launch-gf-server" disabled
                title="Disabled for now">Start GF sidecar</button>
        <button type="button" class="sense-card devmode-setting" id="devmode-launch-fly-cam" disabled
                title="Disabled for now">Start fly-cam viewer</button>
      </div>
    </div>
  </nav>

  <main class="main-content">

    <section id="page-dashboard" class="page landing">
      <h2 class="landing-title">Available devices</h2>
      <div id="robot-grid" class="robot-grid"></div>
    </section>

    <section id="page-robot" class="page hidden">
      <div class="page-header detail-header">
        <h2 id="robot-title"></h2>
        <span id="robot-chip-conn" class="chip"></span>
        <span id="robot-chip-mood" class="chip"></span>
        <span id="robot-chip-mode" class="chip"></span>
        <span id="robot-chip-uptime" class="chip" title="Smooth uptime derived from the adapter's boot epoch"></span>
        <span id="sys-clock" class="chip" title="This browser's clock, to compare with the timestamps below"></span>
      </div>

      <div class="row-grid">
        <div id="camera-card">
          <h3>Camera <span class="muted" id="camera-age" style="float:right;font-size:0.8rem;font-weight:400"></span></h3>
          <div class="camera-feed">
            <img id="camera-feed-img" alt="Camera feed" class="hidden">
            <div class="empty" id="camera-feed-empty">loading…</div>
          </div>
        </div>

        <div id="sweep-card">
          <h3>Scan <span class="muted" id="sweep-age" style="float:right;font-size:0.8rem;font-weight:400"></span></h3>
          <div id="nav-banner" class="nav-banner hidden"></div>
          <div id="sweep-dial" class="sweep-dial"><div class="empty">no scan yet — click "Update"</div></div>
          <div class="button-row sweep-foot-row">
            <button type="button" id="nav-scan">Update</button>
            <button type="button" id="nav-cancel" class="hidden">Cancel route</button>
            <button type="button" id="nav-walk" disabled
                    title="Pin a point on one of the dial's spokes first">Walk</button>
            <span class="posture-zoom-group">
              <button type="button" class="posture-axis" id="sweep-zoom-out">&minus;</button>
              <button type="button" class="posture-axis" id="sweep-zoom-in">+</button>
            </span>
          </div>
        </div>

        <div id="posture-card">
          <h3>Posture <span class="muted" id="posture-age" style="float:right;font-size:0.8rem;font-weight:400"></span></h3>
          <div id="posture-dial" class="posture-dial"><div class="empty">loading…</div></div>
          <div class="posture-axes" title="Drag left/right to spin the view around just this axis">
            <button type="button" class="posture-axis" id="posture-axis-x">X</button>
            <button type="button" class="posture-axis" id="posture-axis-y">Y</button>
            <button type="button" class="posture-axis" id="posture-axis-z">Z</button>
            <span class="posture-zoom-group" title="Scroll on the view, or click, to zoom">
              <button type="button" class="posture-axis" id="posture-zoom-out">&minus;</button>
              <button type="button" class="posture-axis" id="posture-zoom-in">+</button>
            </span>
          </div>
        </div>

        <div class="panel" id="driver-card">
          <h3>Driver</h3>
          <div class="driver-active-row">
            <button type="button" class="driver-option active" id="driver-active-slot" disabled>
              <canvas class="driver-icon" width="104" height="104"></canvas>
              <span class="driver-label" id="driver-active-label">—</span>
            </button>
            <button type="button" id="driver-dropdown-toggle" class="sense-card driver-dropdown-toggle"
                    aria-expanded="false" aria-controls="driver-options" title="Disabled for now -- fixed to Manual"
                    disabled>
              <span class="driver-dropdown-glyph">&#9662;</span>
            </button>
          </div>
          <div class="driver-grid driver-dropdown hidden" id="driver-options">
            <button type="button" class="driver-option" data-mode="fruitfly" data-icon="fruitfly">
              <canvas class="driver-icon" width="104" height="104"></canvas>
              <span class="driver-label">Fruitfly</span>
            </button>
            <button type="button" class="driver-option" data-mode="stationary" data-icon="manual">
              <canvas class="driver-icon" width="104" height="104"></canvas>
              <span class="driver-label">Manual</span>
            </button>
          </div>
        </div>

        <div id="fruitfly-card" class="hidden">
          <h3>Fruitfly <span class="muted" id="fruitfly-age" style="float:right;font-size:0.8rem;font-weight:400"></span></h3>
          <div id="fruitfly-body">
            <div class="empty">not in Fruitfly mode</div>
          </div>
        </div>
      </div>

      <div id="senses-card">
        <h3>Adapters</h3>
        <div id="sense-options">
          <div class="sense-subhead">In</div>
          <div class="sense-grid">
            <button type="button" class="sense-card" data-domain="/eyes">Camera</button>
            <button type="button" class="sense-card" data-domain="/ears">Microphone</button>
            <button type="button" class="sense-card" data-domain="/senses/range">Distance sensor</button>
            <button type="button" class="sense-card" data-domain="/senses">WiFi sniffer</button>
          </div>
          <div class="sense-subhead">Out</div>
          <div class="sense-grid">
            <button type="button" class="sense-card" data-domain="/mouth">Speaker</button>
            <button type="button" class="sense-card" data-domain="/mood/led">LED</button>
          </div>
        </div>
      </div>

      <div id="debug-card" class="hidden">
        <h3>Debug</h3>
        <div class="button-row">
          <button type="button" id="debug-bark">Play positive bark</button>
          <button type="button" id="debug-sit">Sit</button>
          <button type="button" id="debug-stand">Stand</button>
          <button type="button" id="debug-lay">Lay down</button>
        </div>
      </div>

      <!-- Pre-overhaul detail markup: kept in the DOM (hidden) so app.js's
           existing tab-bar/actions/specs wiring keeps running untouched
           until this page is redesigned. -->
      <div class="hidden" id="robot-detail-legacy">
        <!-- Tabs and their frames are generated by app.js from the TABS registry:
             one list decides the order, the labels and which page each tab embeds. -->
        <div class="tab-bar" id="tab-bar" role="tablist" aria-label="Robot sections"></div>

        <div id="robot-tab-actions" class="robot-tab">
          <div class="panel panel-wide" id="arbiter-card"></div>
          <!-- Moved off the Personality tab: the live queue belongs with the
               actions log, not with the personality dimensions. -->
          <div class="panel panel-wide" id="queue-card"></div>
          <div class="panel panel-wide" id="power-card"></div>
          <div class="panel panel-wide">
            <h3>Actions <span id="actions-age" class="muted" style="float:right;font-size:0.8rem;font-weight:400"
                  title="Time since the newest entry, ticking live"></span></h3>
            <ul id="actions" class="activity-feed"></ul>
          </div>
        </div>

        <div id="robot-tab-specs" class="robot-tab hidden">
          <div class="panel panel-wide">
            <h3>Polling
              <span class="muted" style="float:right" id="polling-state"></span>
            </h3>
            <div class="polling-row">
              <label>Telemetry TTL (s) <input type="number" id="poll-ttl" min="5"></label>
              <label>Battery poll (s) <input type="number" id="poll-batt" min="5"></label>
              <label>Idle multiplier <input type="number" id="poll-mult" min="1" step="0.5"></label>
              <label>Idle postures <input type="text" id="poll-postures" placeholder="rest, sit, lnd"></label>
              <button id="poll-save" class="btn-small">Save</button>
            </div>
          </div>
          <div id="specs-content"></div>
        </div>

        <div id="robot-frames"></div>
      </div>
    </section>

  </main>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="vendor/stomp.umd.min.js"></script>
  <script src="common.js"></script>
  <script src="cards.js"></script>
  <script src="specs.js"></script>
  <script src="app.js"></script>
</body>
</html>
