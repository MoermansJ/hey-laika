<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio output</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%233498db%22/></svg>">
  <link rel="stylesheet" href="console.css">
  <style>
    .voice-log { display: flex; flex-direction: column; gap: 0.45rem; max-height: 55vh; overflow-y: auto; }
    .voice-msg { max-width: 72ch; padding: 0.45rem 0.7rem; border-radius: 10px;
      font-size: 0.85rem; border: 1px solid var(--ring); }
    .voice-msg.user  { align-self: flex-end; background: var(--page); }
    .voice-msg.laika { align-self: flex-start; background: var(--surface); }
    .voice-msg.error { align-self: flex-start; color: var(--critical); }
    .voice-msg .who { font-size: 0.65rem; color: var(--muted); display: block; margin-bottom: 0.15rem; }
    .voice-msg .lat { font-size: 0.65rem; color: var(--muted); margin-left: 0.5rem; }
  </style>
  <script src="common.js"></script>
  <script src="cards.js"></script>
  <script src="nav.js" defer></script>
</head>
<body>
  <div class="topbar">
    <h1>Audio output — speaker and conversation</h1>
    <select id="robot-select" title="Robot"></select>
    <span id="voice-chip" class="chip">checking…</span>
  </div>

  <div class="stack">
    <section class="card" id="speaker-card"></section>

    <section class="card">
      <h2>Conversation</h2>
      <div class="row" style="margin-bottom:0.6rem">
        <input type="text" id="voice-input" style="flex:1"
               placeholder="Type a phrase in place of the microphone — e.g. “who’s a good dog?”" autocomplete="off">
        <button id="voice-send" class="primary">Send</button>
      </div>
      <div id="voice-log" class="voice-log"></div>
      <div class="hint">The reply comes from the local LLM. The live microphone, transcripts and wake
        phrase are on the Audio input tab.
        <label style="margin-left:0.5rem"><input type="checkbox" id="bark-on-reply" checked> bark on the dog after a reply</label>
      </div>
    </section>
  </div>

  <script>
    const $ = (sel) => document.querySelector(sel);
    const state = { robotId: null, base: "", speaker: null };
    const api = (path, options) => hlApi(state.base, path, options);

    function voiceLogAppend(kind, text, latencySec) {
      const log = $("#voice-log");
      const msg = document.createElement("div");
      msg.className = `voice-msg ${kind}`;
      const who = kind === "user" ? "you" : kind === "laika" ? "laika" : "error";
      const lat = typeof latencySec === "number"
          ? `<span class="lat">${latencySec.toFixed(1)}s think</span>` : "";
      // LLM output and the user's own text: never raw HTML.
      msg.innerHTML = `<span class="who">${who}${lat}</span>${esc(text)}`;
      log.appendChild(msg);
      log.scrollTop = log.scrollHeight;
    }

    async function refreshVoiceHealth() {
      const chip = $("#voice-chip");
      try {
        const health = await api("/voice/health");
        if (health.ollama?.reachable && health.ollama?.modelAvailable) {
          chip.textContent = `${health.ollama.configuredModel} ready`;
          chip.className = "chip on";
          chip.title = "Local LLM reachable";
          return;
        }
        chip.textContent = health.ollama?.reachable ? "model not pulled" : "LLM offline";
        chip.className = "chip warn";
        chip.title = health.ollama?.reachable
            ? `Pull it on the Ollama host: ollama pull ${health.ollama.configuredModel}`
            : `Ollama unreachable at ${health.ollama?.url ?? "?"} — is the ollama service running?`;
      } catch {
        chip.textContent = "voice unavailable";
        chip.className = "chip warn";
      }
    }

    async function sendVoiceInput() {
      const input = $("#voice-input");
      const button = $("#voice-send");
      const text = input.value.trim();
      if (!text || button.disabled) return;
      voiceLogAppend("user", text);
      input.value = "";
      button.disabled = true;
      button.textContent = "…";
      try {
        const result = await api("/voice/demo", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ input: text }),
        });
        voiceLogAppend("laika", result.response, result.latencySec?.ollama);
        if ($("#bark-on-reply").checked && state.speaker)
          state.speaker.play(Math.random() < 0.5 ? "positive_bark" : "positive_bark2");
      } catch (err) {
        voiceLogAppend("error", err.message);
        if ($("#bark-on-reply").checked && state.speaker) state.speaker.play("negative_bark");
      } finally {
        button.disabled = false;
        button.textContent = "Send";
        input.focus();
      }
    }

    function mount() {
      if (state.speaker) state.speaker.stop();
      state.speaker = hlSpeakerCard($("#speaker-card"), state.base, { title: "Speaker", say: true });
      refreshVoiceHealth();
    }

    async function boot() {
      let page;
      try {
        page = await hlPage({ onRobotChange: (id) => { state.robotId = id; state.base = `/api/robots/${id}`; mount(); } });
      } catch (err) {
        $("#voice-chip").textContent = "orchestrator unreachable";
        return;
      }
      if (!page.robotId) return;
      state.robotId = page.robotId;
      state.base = page.base;
      $("#voice-send").onclick = sendVoiceInput;
      $("#voice-input").addEventListener("keydown", (e) => { if (e.key === "Enter") sendVoiceInput(); });
      mount();
      hlPoll(refreshVoiceHealth, 15000, { immediate: false });
    }
    boot();
  </script>
</body>
</html>
