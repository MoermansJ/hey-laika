<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio output</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%233498db%22/></svg>">
  <link rel="stylesheet" href="console.css">
  <script src="common.js"></script>
  <script src="cards.js"></script>
  <script src="nav.js" defer></script>
</head>
<body>
  <div class="topbar">
    <h1>Audio output — speaker and conversation</h1>
    <select id="robot-select" title="Robot"></select>
    <span id="voice-chip" class="chip">checking…</span>
  </div>

  <div class="stack">
    <section class="card" id="speaker-card"></section>

    <section class="card" id="conversation-card"></section>
  </div>

  <script>
    const $ = (sel) => document.querySelector(sel);
    const state = { robotId: null, base: "", speaker: null, conversation: null };
    const api = (path, options) => hlApi(state.base, path, options);

    async function refreshVoiceHealth() {
      const chip = $("#voice-chip");
      try {
        const health = await api("/voice/health");
        if (health.ollama?.reachable && health.ollama?.modelAvailable) {
          chip.textContent = `${health.ollama.configuredModel} ready`;
          chip.className = "chip on";
          chip.title = "Local LLM reachable";
          return;
        }
        chip.textContent = health.ollama?.reachable ? "model not pulled" : "LLM offline";
        chip.className = "chip warn";
        chip.title = health.ollama?.reachable
            ? `Pull it on the Ollama host: ollama pull ${health.ollama.configuredModel}`
            : `Ollama unreachable at ${health.ollama?.url ?? "?"} — is the ollama service running?`;
      } catch {
        chip.textContent = "voice unavailable";
        chip.className = "chip warn";
      }
    }

    function mount() {
      if (state.speaker) state.speaker.stop();
      if (state.conversation) state.conversation.stop();
      state.speaker = hlSpeakerCard($("#speaker-card"), state.base, { title: "Speaker", say: true });
      state.conversation = hlConversationCard($("#conversation-card"), state.base,
          { title: "Conversation", full: false });
      refreshVoiceHealth();
    }

    async function boot() {
      let page;
      try {
        page = await hlPage({ onRobotChange: (id) => { state.robotId = id; state.base = `/api/robots/${id}`; mount(); } });
      } catch (err) {
        $("#voice-chip").textContent = "orchestrator unreachable";
        return;
      }
      if (!page.robotId) return;
      state.robotId = page.robotId;
      state.base = page.base;
      await hlLoadBadgePalette(state.base);
      mount();
      hlPoll(refreshVoiceHealth, 15000, { immediate: false });
    }
    boot();
  </script>
</body>
</html>
