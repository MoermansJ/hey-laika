<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%233498db%22/></svg>">
  <link rel="stylesheet" href="console.css">
  <style>
    .topbar { margin-bottom: 0.8rem; }
    .topbar h1 { display: flex; align-items: center; gap: 0.5rem; }
    .editbtn { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--ring); background: var(--surface); color: var(--ink-2); cursor: pointer; padding: 0; border-radius: 0; }
    .editbtn:hover, body.editing .editbtn { background: var(--ink); color: var(--surface); border-color: var(--ink); }
    .editbtn svg, .wrench svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    /* No gap between cards: a 1 px ring drawn by each card's shadow is the only separator,
       and an unused cell stays page-coloured. */
    /* Row height follows the column width (set by sizeRows) so a 2x2 body is 4:3, the camera's frame. */
    .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: var(--row, 150px);
      grid-auto-flow: dense; gap: 1px; padding: 1px; }
    .widget { box-shadow: 0 0 0 1px var(--ring); }
    .veil { position: absolute; inset: 0; background: rgba(247, 249, 250, 0.82); display: none; align-items: center;
      justify-content: center; text-align: center; font-size: 0.78rem; color: var(--ink-2); padding: 1rem; z-index: 3; }
    .widget.paused .veil { display: flex; }
    @media (max-width: 1100px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    @media (max-width: 700px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .widget { position: relative; background: var(--surface); border-radius: 0; padding: 0.55rem 0.7rem;
      overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
    .widget.hidden-w { display: none; }
    .w1x1 { grid-column: span 1; grid-row: span 1; }
    .w2x1 { grid-column: span 2; grid-row: span 1; }
    .w2x2 { grid-column: span 2; grid-row: span 2; }
    .w3x3 { grid-column: span 3; grid-row: span 3; }
    .w4x1 { grid-column: span 4; grid-row: span 1; }
    .widget h2 { margin: 0 0 0.35rem; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--ink-2); display: flex; align-items: center; gap: 0.4rem; padding-right: 2rem; min-height: 1.1em; }
    .widget h2 .name { margin-left: auto; color: var(--muted); font-weight: 600; }
    .widget h2 .live { font-weight: 700; color: var(--muted); letter-spacing: 0.1em; }
    .widget.live h2 .live { color: var(--critical); }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #bdc3c7; flex: 0 0 auto; }
    .dot.fresh { background: #27ae60; } .dot.aging { background: var(--warn); } .dot.stale { background: #bdc3c7; }
    .dot.on { background: var(--critical); box-shadow: 0 0 0 2px rgba(231, 76, 60, 0.25); }
    .body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; font-size: 0.82rem; position: relative; }
    .big { font-size: 2rem; font-weight: 600; line-height: 1; color: var(--ink); }
    .big small { font-size: 0.8rem; font-weight: 400; color: var(--muted); margin-left: 0.3rem; }
    .sub { font-size: 0.76rem; color: var(--ink-2); margin-top: 0.25rem; }
    .line { display: flex; justify-content: space-between; gap: 0.5rem; font-size: 0.78rem; padding: 0.1rem 0; }
    .line span:last-child { color: var(--ink-2); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wrench { position: absolute; top: 0.4rem; right: 0.4rem; width: 26px; height: 26px; display: flex;
      align-items: center; justify-content: center; border: 1px solid var(--ring); border-radius: 0;
      background: var(--surface); color: var(--ink-2); opacity: 0; cursor: pointer; padding: 0; z-index: 4;
      transition: opacity 0.12s ease, background 0.12s ease, color 0.12s ease; }
    .widget:hover .wrench { opacity: 1; }
    .wrench:hover, .wrench:focus-visible { background: var(--ink); color: var(--surface); border-color: var(--ink); opacity: 1; }
    .pause { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 3;
      background: rgba(247, 249, 250, 0.7); }
    .widget.paused .pause { display: flex; }
    .pause span { display: flex; gap: 10px; }
    .pause span i { display: block; width: 12px; height: 44px; background: var(--ink-2); }
    .cam { position: relative; width: 100%; aspect-ratio: 4 / 3; max-height: 100%; margin: auto 0; background: #000; overflow: hidden; }
    .cam img, .cam canvas { width: 100%; height: 100%; object-fit: contain; display: block; position: absolute; inset: 0; }
    .cam .play { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 3;
      background: #000; border: none; cursor: pointer; padding: 0; }
    .cam.off .play { display: flex; }
    .cam .play i { display: block; width: 0; height: 0; border-style: solid; border-width: 24px 0 24px 40px;
      border-color: transparent transparent transparent #ecf0f1; }
    .cam .play:hover i { border-left-color: #fff; }
    .cam .ctl { position: absolute; right: 0.4rem; bottom: 0.3rem; z-index: 3; width: 28px; height: 24px; display: none;
      align-items: center; justify-content: center; gap: 4px; background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.35);
      cursor: pointer; padding: 0; }
    .cam .ctl i { display: block; width: 4px; height: 12px; background: #ecf0f1; }
    .cam .ctl:hover { background: #ecf0f1; border-color: #ecf0f1; }
    .cam .ctl:hover i { background: #111; }
    .cam.running .ctl { display: flex; }
    .batt.nodata .shell { stroke: #bdc3c7; } .batt.nodata .nub, .batt.nodata .seg { fill: #bdc3c7; }
    .nodata-text { color: #bdc3c7; }
    .cam svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .cam .box { fill: none; stroke: #2ecc71; stroke-width: 0.6; }
    .cam .box-label { fill: #2ecc71; font-size: 3px; }
    .cam .corner { position: absolute; left: 0.4rem; bottom: 0.3rem; color: #ecf0f1; font-size: 0.7rem;
      background: rgba(0,0,0,0.45); padding: 0.1rem 0.4rem; z-index: 2; }
    .cam .pause { background: rgba(0, 0, 0, 0.55); }
    .cam .pause span i { background: #ecf0f1; }
    .spark { width: 100%; height: 34px; display: block; }
    .wave { width: 100%; height: 100%; display: block; }
    .batt { width: 100%; height: 44px; display: block; }
    .batt .shell { fill: none; stroke: #27ae60; stroke-width: 2.5; }
    .batt .nub { fill: #27ae60; }
    .batt .seg { fill: #27ae60; }
    .batt.low .shell, .batt.low .nub, .batt.low .seg { stroke: var(--critical); fill: var(--critical); }
    .batt.low .shell { fill: none; }
    .batt.blink { animation: battblink 1s steps(2) infinite; }
    @keyframes battblink { 50% { opacity: 0.25; } }
    .bar { height: 10px; background: #ecf0f1; overflow: hidden; margin-top: 0.35rem; }
    .bar div { height: 100%; background: #27ae60; }
    .bar.warn div { background: var(--warn); } .bar.bad div { background: var(--critical); }
    .radar, .compass { width: 100%; height: 100%; display: block; }
    .mapbox { flex: 1; min-height: 0; background: #000; position: relative; }
    .mapbox svg { width: 100%; height: 100%; display: block; }
    .tick { font-size: 0.74rem; line-height: 1.35; overflow: auto; flex: 1; }
    .tick div { display: flex; gap: 0.5rem; border-top: 1px dashed var(--ring); padding: 0.1rem 0; }
    .tick time { color: var(--muted); flex: 0 0 auto; }
    .tick b { font-weight: 600; color: var(--ink-2); flex: 0 0 auto; }
    .banner { display: none; border: 1px solid var(--critical); background: rgba(255,93,93,0.12); border-radius: 0;
      padding: 0.6rem 0.8rem; margin-bottom: 0.75rem; font-size: 0.82rem; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .banner.on { display: flex; }
    .banner b { color: var(--critical); }
    .config { display: none; flex-wrap: wrap; gap: 0.4rem 1rem; font-size: 0.78rem; color: var(--ink-2);
      margin-bottom: 0.75rem; align-items: center; }
    body.editing .config { display: flex; }
    .config .hintline { width: 100%; color: var(--muted); }
    body.editing .widget { cursor: move; }
    body.editing .widget::after { content: ""; position: absolute; inset: 0; border: 2px dashed rgba(77,255,140,0.5); pointer-events: none; z-index: 5; }
    body.editing .widget.dragging { opacity: 0.4; }
    body.editing .widget.over::after { border-color: var(--ink); background: rgba(77,255,140,0.08); }
    .state { font-size: 0.78rem; color: var(--muted); }
    .swatch { width: 100%; height: 34px; border: 1px solid var(--ring); }
    .navstate { display: inline-block; padding: 0.05rem 0.45rem; font-size: 0.72rem; font-weight: 600;
      background: rgba(127,219,163,0.15); color: var(--ink-2); }
    .navstate.moving, .navstate.planning { background: rgba(61,220,255,0.15); color: var(--seq); }
    .navstate.arrived { background: rgba(77,255,140,0.15); color: var(--good); }
    .navstate.blocked, .navstate.unreachable, .navstate.failed { background: rgba(255,204,77,0.15); color: var(--warn); }
    .navstate.error { background: rgba(255,93,93,0.15); color: var(--critical); }
    .row { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.3rem; }
    .row button { font-size: 0.74rem; padding: 0.2rem 0.5rem; border-radius: 0; }
    button, input[type=text] { border-radius: 0; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Dashboard</h1>
    <button class="editbtn" id="edit" title="Edit the layout: drag widgets, show or hide them" aria-label="Edit layout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0 5 5l-7.4 7.4a2.1 2.1 0 0 1-3-3l7.4-7.4z"/><path d="M14.7 6.3 18 3l3 3-3.3 3.3"/></svg></button>
    <select id="robot-select" title="Robot"></select>
    <span class="state" id="state"></span>
    <div class="spacer"></div>
    <label class="muted"><input type="checkbox" id="live" checked> live</label>
  </div>

  <div class="config" id="config"></div>
  <div class="banner" id="banner"></div>
  <div class="grid" id="grid"></div>

  <script src="common.js"></script>
  <script src="cards.js"></script>
  <script src="nav.js" defer></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let BASE = "";
    let ROBOT = "";
    const EMBEDDED = new URLSearchParams(location.search).has("embedded");
    const KEY_HIDDEN = "heyLaikaSensesHidden";
    const KEY_ORDER = "heyLaikaSensesOrder";

    // Each widget: size, the tab that configures it, and for direct sensors
    // the instance name shown top right with the LIVE dot on the left.
    const TAB_PAGES = { eyes: "eyes.html", map: "map.html", ears: "ears.html", leash: "leash.html",
      control: "control.html", behavior: "behavior.html", voice: "voice.html", mind: "mind.html",
      activity: "index.html", metrics: "metrics.html" };
    const WRENCH = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0 5 5l-7.4 7.4a2.1 2.1 0 0 1-3-3l7.4-7.4z"/><path d="M14.7 6.3 18 3l3 3-3.3 3.3"/></svg>`;
    const PAUSE = `<div class="pause"><span><i></i><i></i></span></div>`;

    const WIDGETS = [
      { id: "camera", title: "Camera", size: "w2x2", tab: "eyes", sensor: "CAMERA 1" },
      { id: "sonic", title: "Sonic", size: "w2x1", tab: "map", sensor: "SONIC 1" },
      { id: "minimap", title: "Map", size: "w3x3", tab: "map" },
      { id: "battery", title: "Battery", size: "w2x1", tab: "mind", sensor: "BATTERY 1" },
      { id: "mic", title: "Microphone", size: "w2x1", tab: "ears", sensor: "MIC 1" },
      { id: "heading", title: "Heading", size: "w1x1", tab: "map", sensor: "IMU 1" },
      { id: "mood", title: "Mood", size: "w1x1", tab: "control" },
      { id: "radar", title: "Radar", size: "w2x2", tab: "map", sensor: "SONIC 1 · SWEEP" },
      { id: "wifi", title: "WiFi", size: "w2x1", tab: "leash", sensor: "WIFI 1" },
      { id: "navigation", title: "Navigation", size: "w2x1", tab: "map" },
      { id: "motion", title: "Motion", size: "w1x1", tab: "behavior" },
      { id: "satellite", title: "Satellite", size: "w1x1", tab: "eyes" },
      { id: "speaker", title: "Speaker", size: "w2x1", tab: "voice" },
      { id: "events", title: "Events", size: "w4x1", tab: "activity" },
    ];
    const byId = Object.fromEntries(WIDGETS.map((w) => [w.id, w]));

    const fresh = {};       // widget id -> epoch ms of last good update
    const paused = {};      // widget id -> reason string or null

    function load(key, fallback) {
      try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch { return fallback; }
    }
    function save(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }
    const hiddenSet = () => new Set(load(KEY_HIDDEN, []));
    function order() {
      const saved = load(KEY_ORDER, []);
      const ids = saved.filter((id) => byId[id]);
      WIDGETS.forEach((w) => { if (!ids.includes(w.id)) ids.push(w.id); });
      return ids;
    }

    function openTab(tab) {
      if (EMBEDDED && window.parent !== window) {
        window.parent.postMessage({ type: "laika-open-tab", tab }, "*");
        return;
      }
      const page = TAB_PAGES[tab] || "index.html";
      location.href = page === "index.html" ? `index.html#robot/${encodeURIComponent(ROBOT)}`
        : `${page}?robot=${encodeURIComponent(ROBOT)}`;
    }

    function header(w) {
      if (w.sensor) {
        return `<h2><span class="dot" id="dot-${w.id}"></span><span class="live" id="live-${w.id}">LIVE</span>` +
          `<span class="name">${esc(w.sensor)}</span></h2>`;
      }
      return `<h2><span class="dot" id="dot-${w.id}"></span>${esc(w.title)}</h2>`;
    }

    function build() {
      const hidden = hiddenSet();
      $("grid").innerHTML = order().map((id) => byId[id]).map((w) =>
        `<section class="widget ${w.size}${hidden.has(w.id) ? " hidden-w" : ""}" id="w-${w.id}" data-id="${w.id}">` +
        header(w) +
        `<button class="wrench" data-tab="${w.tab}" title="Configure on the ${esc(w.tab)} tab" aria-label="Configure ${esc(w.title)}">${WRENCH}</button>` +
        `<div class="body" id="body-${w.id}"><span class="empty">…</span></div>` +
        (w.id === "camera" ? "" : w.sensor ? PAUSE : `<div class="veil" id="veil-${w.id}"></div>`) + `</section>`).join("");
      document.querySelectorAll(".wrench").forEach((b) => b.addEventListener("click", (ev) => { ev.stopPropagation(); openTab(b.dataset.tab); }));
      $("config").innerHTML = `<span class="hintline">Editing: drag widgets to reorder, untick to hide. Changes are remembered in this browser.</span>` +
        WIDGETS.map((w) => `<label><input type="checkbox" data-id="${w.id}" ${hidden.has(w.id) ? "" : "checked"}> ${esc(w.title)}</label>`).join("") +
        `<button id="reset-layout">Reset layout</button>` +
        `<span class="hintline">Battery: red below <input type="number" id="batt-red" min="1" max="99" style="width:3.5rem" value="${batterySettings().redPct}"> %,` +
        ` blinking below <input type="number" id="batt-blink" min="1" max="99" style="width:3.5rem" value="${batterySettings().blinkPct}"> %</span>`;
      ["batt-red", "batt-blink"].forEach((id) => $(id).addEventListener("change", () => {
        save(KEY_BATTERY, { redPct: +$("batt-red").value || 30, blinkPct: +$("batt-blink").value || 25 });
        battery();
      }));
      $("config").querySelectorAll("input[type=checkbox]").forEach((cb) => cb.addEventListener("change", () => {
        const set = hiddenSet();
        if (cb.checked) set.delete(cb.dataset.id); else set.add(cb.dataset.id);
        save(KEY_HIDDEN, [...set]);
        $(`w-${cb.dataset.id}`).classList.toggle("hidden-w", !cb.checked);
      }));
      $("reset-layout").addEventListener("click", () => {
        save(KEY_ORDER, []); save(KEY_HIDDEN, []);
        mount(BASE, ROBOT);
      });
      wireDrag();
    }

    // ---- edit mode: drag to reorder ---------------------------------------

    let dragged = null;
    function wireDrag() {
      document.querySelectorAll(".widget").forEach((el) => {
        el.addEventListener("dragstart", (ev) => {
          if (!document.body.classList.contains("editing")) { ev.preventDefault(); return; }
          dragged = el; el.classList.add("dragging");
          ev.dataTransfer.effectAllowed = "move";
          ev.dataTransfer.setData("text/plain", el.dataset.id);
        });
        el.addEventListener("dragend", () => { dragged = null; el.classList.remove("dragging");
          document.querySelectorAll(".widget.over").forEach((o) => o.classList.remove("over")); });
        el.addEventListener("dragover", (ev) => {
          if (!dragged || dragged === el) return;
          ev.preventDefault(); ev.dataTransfer.dropEffect = "move"; el.classList.add("over");
        });
        el.addEventListener("dragleave", () => el.classList.remove("over"));
        el.addEventListener("drop", (ev) => {
          if (!dragged || dragged === el) return;
          ev.preventDefault();
          const grid = $("grid");
          const items = [...grid.querySelectorAll(".widget")];
          const from = items.indexOf(dragged), to = items.indexOf(el);
          if (from < to) el.after(dragged); else el.before(dragged);
          save(KEY_ORDER, [...grid.querySelectorAll(".widget")].map((w) => w.dataset.id));
          el.classList.remove("over");
        });
      });
    }
    function setEditing(on) {
      document.body.classList.toggle("editing", on);
      document.querySelectorAll(".widget").forEach((el) => el.setAttribute("draggable", on ? "true" : "false"));
    }
    $("edit").addEventListener("click", () => setEditing(!document.body.classList.contains("editing")));

    // ---- status ---------------------------------------------------------------

    function body(id) { return $(`body-${id}`); }
    function touched(id) { fresh[id] = Date.now(); }
    function setPaused(id, reason) {
      paused[id] = reason || null;
      const w = $(`w-${id}`);
      w.classList.toggle("paused", !!reason);
      w.title = reason || "";
      const veil = $(`veil-${id}`);
      if (veil) veil.textContent = reason || "";
    }
    function tickDots() {
      const now = Date.now();
      WIDGETS.forEach((w) => {
        const dot = $(`dot-${w.id}`);
        const el = $(`w-${w.id}`);
        const age = fresh[w.id] ? (now - fresh[w.id]) / 1000 : Infinity;
        if (w.sensor) {
          const live = !paused[w.id] && age < 6;
          dot.className = "dot " + (live ? "on" : "stale");
          el.classList.toggle("live", live);
          $(`live-${w.id}`).textContent = paused[w.id] ? "PAUSED" : live ? "LIVE" : "NO FEED";
        } else {
          dot.className = "dot " + (paused[w.id] ? "stale" : age < 6 ? "fresh" : age < 20 ? "aging" : "stale");
        }
        dot.title = paused[w.id] ? paused[w.id] : age === Infinity ? "no data yet" : `${Math.round(age)} s ago`;
      });
    }
    setInterval(tickDots, 1000);

    const api = (path, options) => hlApi(BASE, path, options);
    const live = () => $("live").checked;

    function spark(values, { max = null, misses = true, width = 300, height = 34 } = {}) {
      const vals = values.map((v) => (v == null ? null : Number(v)));
      const known = vals.filter((v) => v != null);
      if (!known.length) return `<svg class="spark" viewBox="0 0 ${width} ${height}"></svg>`;
      const top = max ?? Math.max(...known, 1);
      const step = width / Math.max(1, vals.length - 1);
      const segments = [];
      let current = [];
      let dots = "";
      vals.forEach((v, i) => {
        const x = i * step;
        if (v == null) {
          if (misses) dots += `<circle cx="${x.toFixed(1)}" cy="${height - 3}" r="1.6" fill="#e74c3c"/>`;
          if (current.length) segments.push(current); current = [];
          return;
        }
        const y = height - 2 - (Math.min(v, top) / top) * (height - 6);
        current.push(`${x.toFixed(1)},${y.toFixed(1)}`);
      });
      if (current.length) segments.push(current);
      const paths = segments.map((s) => `<polyline points="${s.join(" ")}" fill="none" stroke="#2980b9" stroke-width="1.5"/>`).join("");
      return `<svg class="spark" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">${paths}${dots}</svg>`;
    }

    // ---- camera: feed, boxes, static when there is none ----------------------

    // Three states: "feed" (frames arriving), "static" (the eyes run but no
    // frame comes back: TV static), "off" (paused or no satellite: black with
    // a play glyph that resumes the eyes).
    let fuzzTimer = null;
    let camMode = "static";
    let camConfigured = false;
    function camInit() {
      body("camera").innerHTML = `<div class="cam" id="cam"><canvas id="cam-fuzz" width="160" height="120"></canvas>` +
        `<img id="cam-img" alt="" hidden><svg id="cam-boxes" viewBox="0 0 100 75" preserveAspectRatio="none"></svg>` +
        `<span class="corner" id="cam-corner">no feed</span>` +
        `<button class="play" id="cam-play" title="Resume the eyes" aria-label="Resume the camera"><i></i></button>` +
        `<button class="ctl" id="cam-pause" title="Pause the eyes" aria-label="Pause the camera"><i></i><i></i></button></div>`;
      const setEyes = async (enabled) => {
        try {
          await api("/eyes/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ enabled }) });
          await camStatus();
        } catch (err) { setState(`${enabled ? "resume" : "pause"} failed: ${err.message}`, true); }
      };
      $("cam-play").addEventListener("click", () => { if (camConfigured) setEyes(true); else openTab("eyes"); });
      $("cam-pause").addEventListener("click", () => setEyes(false));
      if (fuzzTimer) clearInterval(fuzzTimer);
      fuzzTimer = setInterval(fuzz, 80);
    }
    function setCamMode(mode) {
      camMode = mode;
      const cam = $("cam"), canvas = $("cam-fuzz"), img = $("cam-img");
      if (!cam) return;
      cam.classList.toggle("off", mode === "off");
      cam.classList.toggle("running", mode !== "off");   // the pause control shows for feed and static alike
      canvas.hidden = mode !== "static";
      img.hidden = mode !== "feed";
    }
    function fuzz() {
      const canvas = $("cam-fuzz");
      if (!canvas || canvas.hidden || camMode !== "static") return;
      const ctx = canvas.getContext("2d");
      const image = ctx.createImageData(canvas.width, canvas.height);
      const d = image.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = (Math.random() * 255) | 0;
        d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
      }
      ctx.putImageData(image, 0, 0);
    }
    function camFrame() {
      return new Promise((resolve) => {
        const img = $("cam-img");
        if (!img || paused["camera"]) return resolve();   // off: no requests
        img.onload = () => { setCamMode("feed"); touched("camera"); img.onload = img.onerror = null; resolve(); };
        img.onerror = () => { if (!paused["camera"]) setCamMode("static"); img.onload = img.onerror = null; resolve(); };
        img.src = `${BASE}/eyes/snap?t=${Date.now()}`;
      });
    }
    async function camStatus() {
      try {
        const e = await api("/eyes");
        camConfigured = !!e.configured;
        $("cam-boxes").innerHTML = (e.persons || []).map((p) =>
          `<rect class="box" x="${p.x * 100}" y="${p.y * 75}" width="${p.w * 100}" height="${p.h * 75}"/>` +
          `<text class="box-label" x="${p.x * 100 + 0.8}" y="${p.y * 75 + 3.2}">person ${Math.round(p.confidence * 100)}%</text>`).join("");
        const reason = !e.configured ? "SATELLITE_HOST not set" : !e.enabled ? "paused (battery saver or manual)" : null;
        setPaused("camera", reason);
        $("cam-corner").textContent = !e.configured ? "no satellite" : !e.enabled ? "paused"
          : `${e.fps ?? 0} fps · ${e.inferenceMs ?? "—"} ms · ${e.personCount || 0} person${e.personCount === 1 ? "" : "s"}`;
        if (reason) setCamMode("off");
        else if (camMode === "off") setCamMode("static");   // running again: static until a frame lands
      } catch (err) { $("cam-corner").textContent = err.message; }
    }

    // Rows follow the column width so a 2x2 body (two rows plus the 1 px gap,
    // minus padding and header) is 4:3 like the camera frame.
    function sizeRows() {
      const grid = $("grid");
      const columns = getComputedStyle(grid).gridTemplateColumns.split(" ").length;
      const col = (grid.clientWidth - 2 - (columns - 1)) / columns;
      const bodyWidth = 2 * col + 1 - 22.4;          // two columns minus the card padding
      const row = (bodyWidth * 0.75 + 17.6 + 28 - 1) / 2;   // body height plus padding and header, over two rows
      grid.style.setProperty("--row", `${Math.max(120, Math.round(row))}px`);
    }
    new ResizeObserver(sizeRows).observe($("grid"));

    // ---- sonic ------------------------------------------------------------

    let navStatus = null;
    async function sonic() {
      try {
        const r = await api("/senses/range");
        const stop = navStatus?.avoidance?.stopCm ?? 25;
        const pan = navStatus?.sensors?.latest?.panDeg;
        const v = r.distanceCm;
        body("sonic").innerHTML =
          `<div class="big" style="color:${v != null && v <= stop ? "var(--critical)" : "var(--ink)"}">${v == null ? "—" : Math.round(v)}<small>${v == null ? (r.gated ? "" : "no echo") : "cm ahead"}</small></div>` +
          spark(r.recent || [], { max: 200 }) +
          `<div class="sub">${r.reads} reads · ${r.misses} misses · stop at ${stop} cm${pan ? ` · head ${pan}°` : ""}</div>`;
        setPaused("sonic", r.gated ? "paused: standing still (battery saver)" : null);
        if (!r.gated) touched("sonic");
      } catch (err) { body("sonic").innerHTML = `<span class="empty">${esc(err.message)}</span>`; }
    }

    // ---- battery ----------------------------------------------------------

    const KEY_BATTERY = "heyLaikaSensesBattery";
    function batterySettings() {
      const s = load(KEY_BATTERY, {});
      return { redPct: Number.isFinite(+s.redPct) ? +s.redPct : 30,
               blinkPct: Number.isFinite(+s.blinkPct) ? +s.blinkPct : 25 };
    }
    function batteryIcon(pct, low, blink) {
      const segments = 5;
      const filled = pct == null ? 0 : Math.max(pct > 0 ? 1 : 0, Math.round((pct / 100) * segments));
      const W = 120, H = 44, x0 = 4, y0 = 6, w = 100, h = 32, gap = 4;
      const segW = (w - 6 - gap * (segments - 1)) / segments;
      let segs = "";
      for (let i = 0; i < filled; i++) {
        segs += `<rect class="seg" x="${(x0 + 3 + i * (segW + gap)).toFixed(1)}" y="${y0 + 3}" width="${segW.toFixed(1)}" height="${h - 6}"/>`;
      }
      return `<svg class="batt${low ? " low" : ""}${blink ? " blink" : ""}" viewBox="0 0 ${W} ${H}" role="img" aria-label="battery ${pct == null ? "unknown" : Math.round(pct) + " percent"}">` +
        `<rect class="shell" x="${x0}" y="${y0}" width="${w}" height="${h}" rx="0"/>` +
        `<rect class="nub" x="${x0 + w + 2}" y="${y0 + h / 2 - 7}" width="6" height="14"/>${segs}</svg>`;
    }

    const batterySamples = [];   // [t, pct] over the last hour
    async function battery() {
      try {
        const [s, saver, power] = await Promise.all([api("/status"), api("/power/saver"), api("/power")]);
        const pct = s.battery;
        const now = Date.now() / 1000;
        if (pct != null) { batterySamples.push([now, pct]); while (batterySamples.length && now - batterySamples[0][0] > 3600) batterySamples.shift(); }
        let drain = null;
        if (batterySamples.length > 2) {
          const [t0, p0] = batterySamples[0], [t1, p1] = batterySamples[batterySamples.length - 1];
          if (t1 - t0 > 120) drain = (p0 - p1) / ((t1 - t0) / 3600);
        }
        const emptyIn = drain && drain > 0 && pct != null ? Math.round((pct - 8) / drain * 60) : null;
        const cfg = batterySettings();
        const nodata = pct == null || s.connected === false;
        const low = !nodata && pct < cfg.redPct;
        const blink = !nodata && pct < cfg.blinkPct;
        body("battery").innerHTML =
          `<div style="display:flex;gap:0.6rem;align-items:center"><div style="flex:0 0 46%">${batteryIcon(nodata ? null : pct, low, blink).replace('class="batt', `class="batt${nodata ? " nodata" : ""}`)}</div>` +
          `<div><div class="big${nodata ? " nodata-text" : ""}">${nodata ? "—" : Math.round(pct)}<small>%</small></div>` +
          `<span class="navstate ${saver.tier === "active" ? "arrived" : saver.tier === "critical" ? "error" : "blocked"}">${esc(saver.tier || "?")}</span></div></div>` +
          `<div class="sub">${drain != null ? `${drain.toFixed(1)} %/h${emptyIn != null ? ` · empty in ~${emptyIn} min` : ""}` : "drain: collecting…"}` +
          `${power.predictedMinutesLeft != null ? ` · tracker says ${Math.round(power.predictedMinutesLeft)} min` : ""}` +
          `${saver.reasons && saver.reasons.length ? ` · ${esc(saver.reasons.join(", "))}` : ""}</div>`;
        setPaused("battery", s.connected === false ? "robot offline" : null);
        if (pct != null) touched("battery");
      } catch (err) { body("battery").innerHTML = `<span class="empty">${esc(err.message)}</span>`; }
    }

    // ---- radar, heading, navigation (one /navigation poll) ----------------

    function radar() {
      const sw = navStatus?.lastSweep;
      const stop = navStatus?.avoidance?.stopCm ?? 25;
      if (!sw) { body("radar").innerHTML = `<span class="empty">no sweep yet — run one from the Map tab</span>`; return; }
      const W = 200, H = 120, cx = W / 2, cy = H - 8, R = H - 16;
      let html = `<svg class="radar" viewBox="0 0 ${W} ${H}">`;
      [0.5, 1, 1.5, 2].forEach((m) => {
        const r = (m / 2) * R;
        html += `<path d="M${(cx - r).toFixed(1)},${cy} A${r},${r} 0 0 1 ${(cx + r).toFixed(1)},${cy}" fill="none" stroke="#123a22"/>` +
          `<text x="${(cx + r + 1).toFixed(1)}" y="${cy - 1}" font-size="6" fill="#4f9c73">${m}</text>`;
      });
      sw.readings.forEach((rd) => {
        const a = (90 + rd.panDeg) * Math.PI / 180;     // pan left = counter-clockwise on screen
        const d = rd.rangeCm == null ? 2.0 : Math.min(2.0, rd.rangeCm / 100);
        const r = (d / 2) * R;
        const x = cx + Math.cos(a) * r, y = cy - Math.sin(a) * r;
        html += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${rd.rangeCm == null ? "#1f6b3f" : "rgba(46,204,113,0.6)"}" stroke-width="3" stroke-linecap="round"/>`;
        if (rd.rangeCm != null) html += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="${rd.rangeCm <= stop ? "#e74c3c" : "#7fdba3"}"/>`;
      });
      html += `<polygon points="${cx},${cy - 6} ${cx - 4},${cy + 3} ${cx + 4},${cy + 3}" fill="#e74c3c"/></svg>`;
      body("radar").innerHTML = html + `<div class="sub">${new Date(sw.at * 1000).toLocaleTimeString()} · ${sw.hits} echoes · ${sw.freed} cells freed${sw.contradictions?.length ? ` · ${sw.contradictions.length} contradiction(s)` : ""}</div>`;
      if (Date.now() / 1000 - sw.at < 6) touched("radar");
      setPaused("radar", null);
    }

    function heading() {
      const p = navStatus?.pose;
      if (!p) return;
      const W = 100, H = 100, cx = 50, cy = 50, R = 40;
      const needle = (deg, color, len) => {
        const a = deg * Math.PI / 180;
        return `<line x1="${cx}" y1="${cy}" x2="${(cx + Math.cos(a) * len).toFixed(1)}" y2="${(cy - Math.sin(a) * len).toFixed(1)}" stroke="${color}" stroke-width="3" stroke-linecap="round"/>`;
      };
      let html = `<svg class="compass" viewBox="0 0 ${W} ${H}"><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#123a22"/>` +
        `<text x="${cx + R + 3}" y="${cy + 3}" font-size="8" fill="#4f9c73">+x</text>`;
      html += needle(p.heading, "#e74c3c", R - 4) + `<circle cx="${cx}" cy="${cy}" r="3" fill="#7fdba3"/></svg>`;
      body("heading").innerHTML = `<div style="display:flex;gap:0.5rem;align-items:center;height:100%"><div style="flex:0 0 46%;height:100%">${html}</div>` +
        `<div><div class="big" style="font-size:1.4rem">${p.heading}<small>°</small></div><div class="sub">yaw ${p.yaw != null ? p.yaw + "°" : "—"}${p.yawFused ? " fused" : ""}<br>±${p.driftM} m</div></div></div>`;
      if (p.yaw != null) touched("heading");
      setPaused("heading", p.yaw == null && !p.yawFused ? "no IMU reading yet" : null);
    }

    let mapData = null;
    async function minimap() {
      try {
        mapData = await api("/navigation/map");
        const cells = mapData.cells || [], r = mapData.resolutionM, pose = mapData.pose;
        const b = mapData.bounds;
        const xs = [pose.x], ys = [pose.y];
        if (b) { xs.push(b.minCx * r, (b.maxCx + 1) * r); ys.push(b.minCy * r, (b.maxCy + 1) * r); }
        if (mapData.target) { xs.push(mapData.target.x); ys.push(mapData.target.y); }
        const W = 300, H = 300, pad = 12;
        const minX = Math.min(...xs) - 0.3, maxX = Math.max(...xs) + 0.3, minY = Math.min(...ys) - 0.3, maxY = Math.max(...ys) + 0.3;
        const scale = Math.min((W - 2 * pad) / Math.max(1.5, maxX - minX), (H - 2 * pad) / Math.max(1.5, maxY - minY));
        const mx = (minX + maxX) / 2, my = (minY + maxY) / 2;
        const sx = (x) => W / 2 + (x - mx) * scale, sy = (y) => H / 2 - (y - my) * scale;
        const size = Math.max(1, r * scale);
        const viewMinX = mx - (W / 2) / scale, viewMaxX = mx + (W / 2) / scale;
        const viewMinY = my - (H / 2) / scale, viewMaxY = my + (H / 2) / scale;
        const span = viewMaxX - viewMinX;
        const step = span > 16 ? 5 : span > 8 ? 2 : span > 3 ? 1 : 0.5;
        let html = `<svg viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="#000"/>`;
        for (let gx = Math.ceil(viewMinX / step) * step; gx <= viewMaxX; gx += step) {
          const X = sx(gx).toFixed(1);
          html += `<line x1="${X}" x2="${X}" y1="0" y2="${H}" stroke="${Math.abs(gx) < 1e-9 ? "#bdc3c7" : "#3a3f42"}" stroke-width="1"/>`;
          html += `<text x="${X}" y="${H - 3}" font-size="8" fill="#bdc3c7" text-anchor="middle">${+gx.toFixed(1)}</text>`;
        }
        for (let gy = Math.ceil(viewMinY / step) * step; gy <= viewMaxY; gy += step) {
          const Y = sy(gy).toFixed(1);
          html += `<line x1="0" x2="${W}" y1="${Y}" y2="${Y}" stroke="${Math.abs(gy) < 1e-9 ? "#bdc3c7" : "#3a3f42"}" stroke-width="1"/>`;
          html += `<text x="3" y="${(+Y - 2).toFixed(1)}" font-size="8" fill="#bdc3c7">${+gy.toFixed(1)}</text>`;
        }
        cells.forEach(([cx, cy, st, lo]) => {
          const t = Math.min(1, Math.abs(lo) / 3);
          const fill = st === "o" ? `rgba(236,240,241,${0.55 + 0.45 * t})` : `rgba(46,204,113,${0.12 + 0.28 * t})`;
          html += `<rect x="${sx(cx * r).toFixed(1)}" y="${sy((cy + 1) * r).toFixed(1)}" width="${size.toFixed(1)}" height="${size.toFixed(1)}" fill="${fill}"/>`;
        });
        if (mapData.route && mapData.route.waypoints && mapData.route.waypoints.length) {
          const pts = [[pose.x, pose.y], ...mapData.route.waypoints].map(([x, y]) => `${sx(x).toFixed(1)},${sy(y).toFixed(1)}`).join(" ");
          html += `<polyline points="${pts}" fill="none" stroke="#3498db" stroke-width="1.5" stroke-dasharray="5 3"/>`;
        }
        if (mapData.target) html += `<circle cx="${sx(mapData.target.x).toFixed(1)}" cy="${sy(mapData.target.y).toFixed(1)}" r="5" fill="none" stroke="#7fdba3" stroke-width="1.5"/>`;
        html += `<g transform="translate(${sx(pose.x).toFixed(1)} ${sy(pose.y).toFixed(1)}) rotate(${(-pose.heading).toFixed(1)})">` +
          `<polyline points="-6,-7 6,0 -6,7" fill="none" stroke="#2ecc71" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g>`;
        html += `<text x="${W - 4}" y="12" font-size="8" fill="#7f8c8d" text-anchor="end">${(mapData.counts?.free ?? 0)} floor · ${(mapData.counts?.occupied ?? 0)} obstacle · ${step} m grid</text></svg>`;
        body("minimap").innerHTML = `<div class="mapbox">${html}</div>`;
        touched("minimap");
      } catch (err) { body("minimap").innerHTML = `<span class="empty">${esc(err.message)}</span>`; }
    }

    async function navigation() {
      try {
        navStatus = await api("/navigation");
        const n = navStatus, t = n.target;
        body("navigation").innerHTML =
          `<div class="line"><span><span class="navstate ${esc(n.state)}">${esc(n.state)}</span></span><span>${t ? `→ ${t.x}, ${t.y} m` : "no target"}</span></div>` +
          `<div class="line"><span>Remaining</span><span>${n.remainingM != null ? n.remainingM + " m" : "—"}</span></div>` +
          `<div class="line"><span>Stops / blocked / replans</span><span>${n.avoidance.stops} / ${n.blockedCount} / ${n.replans}</span></div>` +
          `<div class="line"><span>Map</span><span>${n.map.grid.free} floor · ${n.map.grid.occupied} obstacle</span></div>`;
        touched("navigation");
        const e = n.errors?.active;
        const banner = $("banner");
        if (e) {
          banner.className = "banner on";
          banner.innerHTML = `<b>She needs help:</b> ${esc(e.kind)} — ${esc(e.message)} (${Math.round(e.waitingS)} s)` +
            `<span class="row"><button class="primary" data-choice="trust_sensor">Sensor is right</button>` +
            `<button data-choice="trust_map">Map is right</button><button data-choice="manual">I moved her</button></span>`;
          banner.querySelectorAll("button[data-choice]").forEach((b) => b.addEventListener("click", async () => {
            try {
              await api("/navigation/errors/respond", { method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ choice: b.dataset.choice }) });
              await navigation();
            } catch (err) { setState(`answer failed: ${err.message}`, true); }
          }));
        } else banner.className = "banner";
        radar(); heading();
      } catch (err) { body("navigation").innerHTML = `<span class="empty">${esc(err.message)}</span>`; }
    }

    // ---- microphone: a voice-activity line ---------------------------------

    const micState = { rms: 0, peak: 0, floor: 300, speaking: false, streaming: false, level: 0, phase: 0 };
    let waveTimer = null;
    function micInit() {
      body("mic").innerHTML = `<canvas class="wave" id="wave" width="300" height="70"></canvas><div class="sub" id="mic-sub"></div>`;
      if (waveTimer) clearInterval(waveTimer);
      waveTimer = setInterval(drawWave, 40);
    }
    function drawWave() {
      const canvas = $("wave");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const W = canvas.width, H = canvas.height, mid = H / 2;
      // Amplitude follows the measured level with a quick attack and a slow release.
      const target = micState.streaming ? Math.min(1, micState.rms / Math.max(1, micState.floor * 6)) : 0;
      micState.level += (target - micState.level) * (target > micState.level ? 0.5 : 0.08);
      micState.phase += 0.35;
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = micState.speaking ? "#e74c3c" : "#2c3e50";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 2) {
        const env = Math.exp(-Math.pow((x - W / 2) / (W / 3), 2));          // louder in the middle
        const a = micState.level * (mid - 4) * env;
        const y = mid + Math.sin(x * 0.18 + micState.phase) * a * 0.6 + (Math.random() - 0.5) * a * 0.9;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    async function mic() {
      try {
        const e = await api("/ears");
        const l = e.level || {};
        Object.assign(micState, { rms: l.rms || 0, peak: l.peak || 0, floor: l.floor || 300,
          speaking: !!l.speaking, streaming: !!e.streaming });
        if (!$("wave")) micInit();
        $("mic-sub").innerHTML = `${Math.round(l.rms || 0)} rms · peak ${l.peak ?? "—"} · floor ${l.floor ?? "—"}${l.speaking ? " · gate open" : ""} · ${e.wakes ?? 0} wakes` +
          (e.lastText ? ` · “${esc(e.lastText)}”` : "");
        setPaused("mic", e.streaming ? null : "no audio from the satellite");
        if (e.streaming) touched("mic");
      } catch (err) { body("mic").innerHTML = `<span class="empty">${esc(err.message)}</span>`; }
    }

    // ---- wifi, motion, satellite, events, mood, speaker --------------------

    const rssiSamples = [];
    async function wifi() {
      try {
        const settled = await Promise.allSettled([api("/leash"), paused["satellite"] ? Promise.reject(new Error("no satellite")) : api("/satellite"), api("/senses")]);
        const v = (r, fallback) => (r.status === "fulfilled" ? r.value : fallback);
        const l = v(settled[0], {}), sat = v(settled[1], {}), s = v(settled[2], {});
        if (l.rssi != null) { rssiSamples.push(l.rssi); if (rssiSamples.length > 60) rssiSamples.shift(); }
        body("wifi").innerHTML =
          `<div class="big">${l.rssi != null ? Math.round(l.rssi) : "—"}<small>dBm to ${esc(l.ssid || "router")}</small> ${l.enabled ? `<span class="navstate ${l.zone === "near" ? "arrived" : "blocked"}">${esc(l.zone || "?")}</span>` : ""}</div>` +
          spark(rssiSamples.map((x) => x + 100), { max: 70, misses: false }) +
          `<div class="sub">satellite ${sat.device?.rssi != null ? sat.device.rssi + " dBm" : "offline"} · last scan ${s.lastSniffAgeS != null ? Math.round(s.lastSniffAgeS) + " s ago" : "none"} · ${s.sampleCount ?? 0} samples</div>`;
        setPaused("wifi", l.rssi == null && !sat.device ? "no signal data" : null);
        if (l.rssi != null || sat.device) touched("wifi");
      } catch (err) { body("wifi").innerHTML = `<span class="empty">${esc(err.message)}</span>`; }
    }

    async function motion() {
      try {
        const [a, s] = await Promise.all([api("/arbiter/status"), api("/status")]);
        const c = a.current;
        const moving = navStatus?.avoidance?.moving;
        body("motion").innerHTML =
          `<div class="big" style="font-size:1.1rem">${c ? esc(c.behavior) : "idle"}</div>` +
          `<div class="sub">${c ? `${esc(c.source)} · step ${c.step}${c.stepTotal ? "/" + c.stepTotal : ""}` : moving ? "moving" : "still"}</div>` +
          `<div class="sub mono" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.lastCommand || "—")}</div>`;
        touched("motion");
      } catch (err) { body("motion").innerHTML = `<span class="empty">${esc(err.message)}</span>`; }
    }

    async function satellite() {
      try {
        const sat = await api("/satellite");
        const d = sat.device;
        body("satellite").innerHTML = d
          ? `<div class="big" style="font-size:1.1rem">up ${Math.round((d.uptimeS || 0) / 60)}<small>min</small></div>` +
            `<div class="sub">mic ${d.mic ? "ok" : "off"} · cam ${d.camera ? "ok" : "off"}<br>${d.rssi} dBm · ${d.packets ?? 0} pkts</div>`
          : `<span class="empty">${sat.enabled ? "offline" : "not configured"}</span>`;
        setPaused("satellite", d ? null : "satellite offline");
        if (d) touched("satellite");
      } catch (err) {
        body("satellite").innerHTML = `<span class="empty">${esc(err.message)}</span>`;
        setPaused("satellite", err.status === 409 ? "SATELLITE_HOST not set" : null);
      }
    }

    async function events() {
      try {
        const a = await api("/activity");
        const rows = (a.activity || []).slice(0, 12);
        body("events").innerHTML = `<div class="tick">` + rows.map((r) =>
          `<div><time>${esc(new Date(r.at).toLocaleTimeString())}</time><b>${esc(r.kind)}</b><span>${esc(r.message)}</span></div>`).join("") + `</div>`;
        touched("events");
      } catch (err) { body("events").innerHTML = `<span class="empty">${esc(err.message)}</span>`; }
    }

    async function mood() {
      try {
        const m = await api("/mood");
        const c = m.color || {};
        const rgb = `rgb(${c.r ?? 0},${c.g ?? 0},${c.b ?? 0})`;
        body("mood").innerHTML =
          `<div class="swatch" style="background:${rgb};opacity:${(c.brightness ?? 255) / 255}"></div>` +
          `<div class="sub"><b>${esc(m.mood || "—")}</b> · ${esc(c.effect || "")}${m.hold ? ` · held` : ""}${m.flash ? ` · flash ${m.flash.remainingS}s` : ""}</div>`;
        setPaused("mood", m.enabled ? null : "mood light disabled");
        if (m.enabled) touched("mood");
      } catch (err) { body("mood").innerHTML = `<span class="empty">${esc(err.message)}</span>`; }
    }

    async function speaker() {
      try {
        const s = await api("/mouth");
        const when = s.at ? new Date(s.at * 1000).toLocaleTimeString() : null;
        body("speaker").innerHTML =
          `<div class="sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.text ? `“${esc(s.text)}”` : "nothing said yet"}${when ? ` <span class="muted">${when}</span>` : ""}</div>` +
          `<div class="row"><input type="text" id="say-text" placeholder="say something" style="flex:1;min-width:0"><button id="say-go">Speak</button></div>` +
          `<div class="sub">${s.enabled ? `${esc(s.ttsEngine || "tts")} · ${esc(s.voice?.voice || "")}` : "SPEAKER_PIN not set"}${s.error ? ` · ${esc(s.error)}` : ""}</div>`;
        $("say-go").addEventListener("click", async () => {
          const text = $("say-text").value.trim();
          if (!text) return;
          try {
            await api("/mouth/say", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
            await speaker();
          } catch (err) { setState(`speak failed: ${err.message}`, true); }
        });
        setPaused("speaker", s.enabled ? null : "SPEAKER_PIN not set");
        if (s.enabled) touched("speaker");
      } catch (err) { body("speaker").innerHTML = `<span class="empty">${esc(err.message)}</span>`; }
    }

    function setState(text, isError) {
      const el = $("state");
      el.textContent = text || "";
      el.style.color = isError ? "var(--critical)" : "var(--muted)";
    }

    const pollers = [];
    function poll(fn, ms) { pollers.push(hlPoll(async () => { if (live()) await fn(); }, ms)); }

    function mount(base, robotId) {
      BASE = base; ROBOT = robotId;
      pollers.forEach((p) => p.stop());
      pollers.length = 0;
      build();
      setEditing(document.body.classList.contains("editing"));
      camInit();
      micInit();
      poll(mood, 3000);
      poll(async () => { if (!$("say-text") || !$("say-text").value) await speaker(); }, 10000);
      poll(camFrame, 330); poll(camStatus, 1000);
      poll(navigation, 2000); poll(sonic, 1000); poll(battery, 5000);
      poll(mic, 500); poll(wifi, 3000); poll(minimap, 3000);
      poll(motion, 2000); poll(satellite, 15000); poll(events, 4000);
      setState(`mounted ${new Date().toLocaleTimeString()}`);
    }

    (async function boot() {
      let page;
      try {
        page = await hlPage({ onRobotChange: (id) => mount(`/api/robots/${id}`, id) });
      } catch (err) { setState(`orchestrator unreachable: ${err.message}`, true); return; }
      if (!page.robotId) return;
      mount(page.base, page.robotId);
    })();
  </script>
</body>
</html>
